<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== deck 템플릿: 모션 그래픽 발표 자료 (16:9, 넘길 때마다 한 장씩) =====
   content.slides 의 장을 차례로 보여 줘요. 장마다 등장이 끝나면 멈추고, 넘기면 다음 장으로 전환돼요.
   강조색 도형 하나(#dk-mo)가 모든 장을 따라다니며 모양을 바꿔요: 제목 옆 막대 → 구분 장 전체 화면 → 숫자 아래 줄 …
   장 종류(type): cover 표지 · agenda 목차 · section 구분 · bullets 글머리 · cards 카드 · statement 한 문장 · number 숫자 · stats 숫자 여러 개
                 chart 막대 그래프 · compare 비교 · steps 단계 · image 사진 · quote 인용 · closing 마무리 */
#cam { --mx: calc(var(--u) * 8.4); --my: calc(var(--u) * 7); --sbgc: var(--bg); --fg: var(--on-bg); --hl: var(--accent); --hl-ink: var(--accent-ink);
  --muted: color-mix(in srgb, var(--fg) 66%, transparent); --line: color-mix(in srgb, var(--fg) 18%, transparent); --card: color-mix(in srgb, var(--fg) 7%, transparent);
  --pat: var(--pattern, color-mix(in srgb, var(--fg) 8%, transparent)); --rad: var(--radius, calc(var(--u) * 1.6)); color: var(--fg); }
#cam.sch-paper { --sbgc: var(--paper); --fg: var(--ink); --pat: color-mix(in srgb, var(--ink) 7%, transparent); }
#dk-bg { position: absolute; inset: 0; background: var(--sbgc); overflow: hidden; }
.pat { position: absolute; inset: -10%; pointer-events: none; }
.pat.dots { background-image: radial-gradient(circle, var(--pat) 0 calc(var(--u) * .3), transparent calc(var(--u) * .34)); background-size: calc(var(--u) * 4.2) calc(var(--u) * 4.2); }
.pat.grid { background-image: linear-gradient(var(--pat) 1px, transparent 1px), linear-gradient(90deg, var(--pat) 1px, transparent 1px); background-size: calc(var(--u) * 7) calc(var(--u) * 7); }
.pat.lines { background-image: linear-gradient(var(--pat) 1px, transparent 1px); background-size: 100% calc(var(--u) * 5); }
.mesh { position: absolute; inset: -25%; pointer-events: none; filter: blur(calc(var(--u) * 11)); opacity: .9; }
.mesh b { position: absolute; display: block; border-radius: 50%; width: 52%; aspect-ratio: 1; }
.mesh b:nth-child(1) { background: color-mix(in srgb, var(--pal1, var(--hl)) 46%, var(--sbgc)); }
.mesh b:nth-child(2) { background: color-mix(in srgb, color-mix(in srgb, var(--pal2, var(--hl)) 55%, #fff) 40%, var(--sbgc)); }
.mesh b:nth-child(3) { background: color-mix(in srgb, var(--pal3, var(--fg)) 18%, var(--sbgc)); }
.mesh.aurora { filter: blur(calc(var(--u) * 8)); }
.mesh.aurora b { width: 95%; aspect-ratio: 3 / 1; }
.orb { position: absolute; width: calc(var(--u) * 46); aspect-ratio: 1; right: calc(var(--u) * -10); bottom: calc(var(--u) * -14); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--hl) 55%, transparent), transparent); filter: blur(calc(var(--u) * 2)); }
.rings { position: absolute; right: calc(var(--u) * -14); top: calc(var(--u) * -14); width: calc(var(--u) * 60); aspect-ratio: 1; }
.rings i { position: absolute; inset: 0; border: 1px solid var(--line); border-radius: 50%; }
.rings i:nth-child(2) { inset: 12%; } .rings i:nth-child(3) { inset: 24%; } .rings i:nth-child(4) { inset: 36%; }
.cmark { position: absolute; width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); border: 0 solid var(--muted); }
.cmark.a { left: calc(var(--u) * 3); top: calc(var(--u) * 3); border-left-width: 1.5px; border-top-width: 1.5px; }
.cmark.b { right: calc(var(--u) * 3); top: calc(var(--u) * 3); border-right-width: 1.5px; border-top-width: 1.5px; }
.cmark.c { left: calc(var(--u) * 3); bottom: calc(var(--u) * 3); border-left-width: 1.5px; border-bottom-width: 1.5px; }
.cmark.d { right: calc(var(--u) * 3); bottom: calc(var(--u) * 3); border-right-width: 1.5px; border-bottom-width: 1.5px; }

/* 틀(scenes.frame): 화면 전체를 앱 창·브라우저·터미널·카드 안에 담음 */
#dk-frame { position: absolute; left: calc(var(--u) * 3.2); right: calc(var(--u) * 3.2); top: calc(var(--u) * 3.2); bottom: calc(var(--u) * 3.2); border-radius: var(--rad);
  background: color-mix(in srgb, var(--fg) 5%, var(--sbgc)); box-shadow: inset 0 0 0 1px var(--line), 0 calc(var(--u) * 1.4) calc(var(--u) * 5) rgba(0, 0, 0, .18); overflow: hidden; }
#dk-frame .fbar { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 4.2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: calc(var(--u) * .9); padding: 0 calc(var(--u) * 1.8); }
#dk-frame .fbar i { width: calc(var(--u) * 1.15); height: calc(var(--u) * 1.15); border-radius: 50%; background: var(--line); }
#dk-frame .fbar span { margin-left: calc(var(--u) * 1.6); font: 500 calc(var(--u) * 1.5)/1 var(--font-body); color: var(--muted); }
#dk-frame .fbar em { flex: 1; max-width: 46%; margin: 0 auto; height: calc(var(--u) * 2.4); border-radius: 99px; background: var(--card); font: 500 calc(var(--u) * 1.3)/calc(var(--u) * 2.4) var(--font-body); color: var(--muted); text-align: center; font-style: normal; }
[data-frame="terminal"] #dk-frame { background: #0d0f10; }
[data-frame="card"] #dk-frame .fbar, [data-frame="poster"] #dk-frame .fbar { display: none; }
[data-frame="poster"] #dk-frame { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); border-radius: 0; }
[data-frame] #cam { --mx: calc(var(--u) * 10.4); }
[data-frame="window"] #cam, [data-frame="browser"] #cam, [data-frame="terminal"] #cam { --my: calc(var(--u) * 10.2); }

/* 따라다니는 강조 도형 */
#dk-mo { position: absolute; left: 0; top: 0; width: 0; height: 0; background: var(--hl); border-radius: calc(var(--u) * .4); z-index: 1; }
.slide { z-index: 2; }
.slide .pg { position: absolute; left: var(--mx); right: var(--mx); top: var(--my); bottom: calc(var(--my) + var(--u) * 2.6); display: flex; flex-direction: column; }
.mo-slot { position: absolute; display: block; visibility: hidden; pointer-events: none; }

/* 바닥글 */
#dk-ft { position: absolute; left: var(--mx); right: var(--mx); bottom: calc(var(--my) - var(--u) * 3.2); display: flex; align-items: center; gap: calc(var(--u) * 2); z-index: 3;
  font: 600 calc(var(--u) * 1.45)/1 var(--font-body); color: var(--muted); letter-spacing: .02em; }
#dk-ft .brand { display: flex; align-items: center; gap: calc(var(--u) * 1); }
#dk-ft .brand img { height: calc(var(--u) * 2.2); width: auto; }
#dk-ft .ttl { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#dk-ft .no { font-variant-numeric: tabular-nums; min-width: calc(var(--u) * 7); text-align: right; }
#dk-ft .no b { color: var(--fg); font-weight: 800; }

/* 공통 글자 */
.kick { align-self: flex-start; font: 700 calc(var(--u) * 2)/1 var(--font-body); color: var(--hl); letter-spacing: .06em; margin-bottom: calc(var(--u) * 1.8); white-space: nowrap; }
.hd { position: relative; flex: none; margin-bottom: calc(var(--u) * 4.2); }
.hd .mo-slot { left: calc(var(--u) * -2.6); width: calc(var(--u) * .9); top: .12em; height: 1em; }
.htl { font: 800 calc(var(--u) * 6)/1.18 var(--font-heading); letter-spacing: -.025em; margin: 0; white-space: pre-line; word-break: keep-all; color: var(--fg); }
.htl .hl, .big .hl, .stm .hl, .qtx .hl { color: var(--hl); }
.bd { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding-bottom: calc(var(--u) * 3); }
.t-chart .bd { justify-content: stretch; padding-bottom: 0; }
.sub { font: 500 calc(var(--u) * 2.6)/1.5 var(--font-body); color: var(--muted); margin: 0; white-space: pre-line; word-break: keep-all; }
.src { font: 500 calc(var(--u) * 1.6)/1.4 var(--font-body); color: var(--muted); padding-top: calc(var(--u) * 3); white-space: pre-line; }
.bd > .src { position: absolute; left: 0; bottom: 0; padding: 0; }

/* cover · closing */
.t-cover .pg, .t-closing .pg { justify-content: center; }
.big { font: 900 calc(var(--u) * 11)/1.08 var(--font-heading); letter-spacing: -.04em; margin: 0; white-space: pre-line; word-break: keep-all; color: var(--fg); }
.t-cover .mo-slot, .t-closing .mo-slot { position: relative; visibility: hidden; width: calc(var(--u) * 14); height: calc(var(--u) * 1.1); margin: calc(var(--u) * 4) 0 calc(var(--u) * 3.4); }
.t-cover .bm { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: calc(var(--u) * 1.2); font: 800 calc(var(--u) * 2.2)/1 var(--font-display); color: var(--fg); }
.t-cover .bm img { height: calc(var(--u) * 4.2); width: auto; }
.t-cover .bm span { font: 600 calc(var(--u) * 1.4)/1 var(--font-body); color: var(--muted); letter-spacing: .2em; }
.t-closing .logo { margin-bottom: calc(var(--u) * 4); }
.t-closing .logo img { height: calc(var(--u) * 7); width: auto; }
.t-closing .logo span { font: 900 calc(var(--u) * 4)/1 var(--font-display); color: var(--fg); }
[data-salign="center"] .t-cover .pg, [data-salign="center"] .t-closing .pg, [data-salign="center"] .t-statement .pg, [data-salign="center"] .t-number .pg { align-items: center; text-align: center; }
[data-salign="center"] .t-cover .kick, [data-salign="center"] .t-closing .kick, [data-salign="center"] .t-statement .kick, [data-salign="center"] .t-number .kick { align-self: center; }

/* section 구분: 도형이 화면을 가득 채움 */
.t-section .pg { justify-content: center; color: var(--sec-ink); }
.t-section .mo-slot.full { left: 0; top: 0; width: 100%; height: 100%; }
.snum { font: 900 calc(var(--u) * 20)/.85 var(--font-display); letter-spacing: -.05em; color: var(--sec-ink); opacity: .9; margin-bottom: calc(var(--u) * 3); font-variant-numeric: tabular-nums; }
.t-section .big { color: var(--sec-ink); font-size: calc(var(--u) * 8.4); }
.t-section .sub { color: color-mix(in srgb, var(--sec-ink) 72%, transparent); margin-top: calc(var(--u) * 2.6); }

/* agenda 목차 */
.ag { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; column-gap: calc(var(--u) * 8); align-content: start; }
.ag li { display: flex; align-items: baseline; gap: calc(var(--u) * 2.6); padding: calc(var(--u) * 2.2) 0; border-bottom: 1px solid var(--line); font: 700 calc(var(--u) * 3.6)/1.3 var(--font-heading); color: var(--fg); word-break: keep-all; }
.ag li b { flex: none; font: 800 calc(var(--u) * 2.4)/1 var(--font-display); color: var(--hl); font-variant-numeric: tabular-nums; min-width: calc(var(--u) * 4); }

/* bullets 글머리 */
.bl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
.bl li { position: relative; padding-left: calc(var(--u) * 4); font: 600 calc(var(--u) * 3.5)/1.42 var(--font-body); color: var(--fg); word-break: keep-all; }
.bl li::before { content: ""; position: absolute; left: 0; top: .5em; width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 50%; background: var(--hl); }
.bl li b { display: block; font-weight: 800; }
.bl li span { display: block; font-size: .78em; color: var(--muted); font-weight: 500; margin-top: .2em; }
.bl li b + span { margin-top: .3em; }

/* cards 카드 */
.cards { display: grid; gap: calc(var(--u) * 2.4); align-content: center; }
.cd { position: relative; border-radius: var(--rad); background: var(--card); min-height: calc(var(--u) * 30); padding: calc(var(--u) * 3.8) calc(var(--u) * 3.4); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); min-width: 0; overflow: hidden; }
.cd .no { font: 800 calc(var(--u) * 2)/1 var(--font-display); color: var(--hl); letter-spacing: .04em; margin-bottom: auto; padding-bottom: calc(var(--u) * 6); }
.cd b { font: 800 calc(var(--u) * 3.5)/1.25 var(--font-heading); color: var(--fg); word-break: keep-all; white-space: pre-line; }
.cd span { font: 500 calc(var(--u) * 2.5)/1.5 var(--font-body); color: var(--muted); word-break: keep-all; white-space: pre-line; }
[data-scard="glass"] .cd, [data-scard="glass"] .cmp .side { background: color-mix(in srgb, var(--fg) 8%, transparent); backdrop-filter: blur(calc(var(--u) * 2)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 22%, transparent); }
[data-scard="outline"] .cd, [data-scard="outline"] .cmp .side { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
[data-scard="paper"] .cd, [data-scard="paper"] .cmp .side { background: #fffdf7; box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 2) rgba(0, 0, 0, .16); }
[data-scard="paper"] .cd b, [data-scard="paper"] .cmp .side li, [data-scard="paper"] .cmp .tag { color: #1d1b18; }
[data-scard="paper"] .cd span { color: rgba(29, 27, 24, .7); }
[data-scard="shadow"] .cd, [data-scard="shadow"] .cmp .side { background: color-mix(in srgb, var(--sbgc) 70%, #fff); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0, 0, 0, .14); }

/* statement 한 문장 */
.t-statement .pg { justify-content: center; }
.stm { font: 900 calc(var(--u) * 8)/1.2 var(--font-heading); letter-spacing: -.035em; margin: 0; white-space: pre-line; word-break: keep-all; color: var(--fg); }
.t-statement .mo-slot { position: relative; width: calc(var(--u) * 10); height: calc(var(--u) * .9); margin: calc(var(--u) * 4) 0 calc(var(--u) * 2.6); }
[data-salign="center"] .t-statement .mo-slot, [data-salign="center"] .t-number .mo-slot, [data-salign="center"] .t-cover .mo-slot, [data-salign="center"] .t-closing .mo-slot { align-self: center; }

/* number 숫자 하나 */
.t-number .pg { justify-content: center; }
.t-number .src, .t-statement .src { padding-top: calc(var(--u) * 4); }
.bign { font: 900 calc(var(--u) * 24)/.9 var(--font-display); letter-spacing: -.05em; color: var(--hl); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bign small { font-size: .3em; letter-spacing: 0; margin-left: .08em; color: var(--fg); font-weight: 800; }
.bign .pre { font-size: .3em; letter-spacing: 0; margin-right: .12em; color: var(--fg); font-weight: 800; vertical-align: .9em; }
.t-number .mo-slot { position: relative; width: calc(var(--u) * 26); height: calc(var(--u) * .7); margin: calc(var(--u) * 3.2) 0 calc(var(--u) * 3); }
.nlab { font: 800 calc(var(--u) * 4.4)/1.3 var(--font-heading); letter-spacing: -.02em; margin: 0; white-space: pre-line; word-break: keep-all; color: var(--fg); }

/* stats 숫자 여러 개 */
.stats { display: grid; align-content: center; }
.st { padding: 0 calc(var(--u) * 3); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); min-width: 0; }
.st:first-child { border-left: 0; padding-left: 0; }
.st .v { font: 900 calc(var(--u) * 11)/1 var(--font-display); letter-spacing: -.04em; color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.st .v .u { font-size: .42em; letter-spacing: 0; margin-left: .06em; color: var(--muted); font-weight: 800; }
.st:last-child .v { color: var(--hl); }
.st .l { font: 600 calc(var(--u) * 2.6)/1.45 var(--font-body); color: var(--muted); word-break: keep-all; white-space: pre-line; }

/* chart 막대 */
.chart { position: relative; flex: 1; min-height: 0; margin: calc(var(--u) * 2) 0 calc(var(--u) * 8); }
.chart .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; gap: 4%; }
.chart .bc { position: relative; flex: 1 1 0; max-width: calc(var(--u) * 15); height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.chart .bc b { width: 100%; background: color-mix(in srgb, var(--fg) 20%, transparent); border-radius: calc(var(--u) * .8) calc(var(--u) * .8) 0 0; transform-origin: 50% 100%; }
.chart .bc.last b { background: var(--hl); }
.chart .bv { font: 800 calc(var(--u) * 3.4)/1 var(--font-display); color: var(--fg); margin-bottom: calc(var(--u) * 1.2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart .bc.last .bv { color: var(--hl); }
.chart .bn { position: absolute; top: 100%; left: -20%; right: -20%; margin-top: calc(var(--u) * 1.6); font: 600 calc(var(--u) * 2.4)/1.2 var(--font-body); color: var(--muted); text-align: center; word-break: keep-all; }
.chart .base { position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--fg); opacity: .4; transform-origin: 0 50%; }

/* compare 비교 */
.cmp { display: flex; gap: calc(var(--u) * 2.4); align-items: stretch; min-height: calc(var(--u) * 34); }
.cmp .side { flex: 1; border-radius: var(--rad); background: var(--card); padding: calc(var(--u) * 3.6) calc(var(--u) * 3.4); display: flex; flex-direction: column; gap: calc(var(--u) * 2.2); min-width: 0; }
.cmp .side.b { background: var(--hl); color: var(--hl-ink); box-shadow: none; }
.cmp .tag { align-self: flex-start; font: 800 calc(var(--u) * 2.1)/1 var(--font-body); padding: calc(var(--u) * 1.1) calc(var(--u) * 2) calc(var(--u) * 1.2); border-radius: 99px; background: var(--card); color: var(--fg); white-space: nowrap; letter-spacing: .03em; }
.cmp .side.b .tag { background: color-mix(in srgb, var(--hl-ink) 16%, transparent); color: var(--hl-ink); }
.cmp ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1.7); }
.cmp li { position: relative; padding-left: calc(var(--u) * 2.8); font: 600 calc(var(--u) * 3.1)/1.42 var(--font-body); color: var(--fg); word-break: keep-all; }
.cmp li::before { content: ""; position: absolute; left: 0; top: .62em; width: calc(var(--u) * 1.1); height: 2px; background: currentColor; opacity: .55; }
.cmp .side.b li { color: var(--hl-ink); }
.cmp .vs { flex: none; align-self: center; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: 50%; background: var(--fg); display: grid; place-items: center; margin: 0 calc(var(--u) * -3.2); z-index: 2; }
.cmp .vs svg { width: 52%; height: 52%; fill: var(--sbgc); }
[data-scard="paper"] .cmp .side.b, [data-scard="glass"] .cmp .side.b, [data-scard="outline"] .cmp .side.b, [data-scard="shadow"] .cmp .side.b { background: var(--hl); color: var(--hl-ink); box-shadow: none; }

/* steps 단계 */
.steps { position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
.steps .ln { position: absolute; height: 2px; background: var(--line); overflow: hidden; }
.steps .ln i { position: absolute; inset: 0; background: var(--hl); transform-origin: 0 50%; }
.steps .sp { position: relative; flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); padding-right: calc(var(--u) * 2.4); min-width: 0; }
.steps .sp .dt { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: 50%; background: var(--sbgc); box-shadow: inset 0 0 0 2px var(--hl); display: grid; place-items: center; font: 800 calc(var(--u) * 2.1)/1 var(--font-display); color: var(--hl); margin-bottom: calc(var(--u) * 1.2); }
.steps .sp b { font: 800 calc(var(--u) * 3.6)/1.25 var(--font-heading); color: var(--fg); word-break: keep-all; white-space: pre-line; }
.steps .sp span { font: 500 calc(var(--u) * 2.5)/1.5 var(--font-body); color: var(--muted); word-break: keep-all; white-space: pre-line; }

/* image 사진 */
.t-image .ph { position: absolute; top: 0; bottom: 0; left: 0; width: 46%; overflow: hidden; z-index: 0; }
.t-image.full .ph { width: 100%; }
.t-image .ph img { width: 100%; height: 100%; object-fit: cover; }
.t-image.full .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.1) 100%); }
.t-image.split .pg { left: calc(46% + var(--u) * 6); }
.t-image.full .pg { justify-content: flex-end; color: #fff; --fg: #fff; --muted: rgba(255,255,255,.78); }
.t-image.split .pg { justify-content: center; }
.t-image .ptx { font: 500 calc(var(--u) * 2.8)/1.6 var(--font-body); color: var(--muted); margin: 0; white-space: pre-line; word-break: keep-all; }
.t-image .bl { margin-top: calc(var(--u) * 1); }

        const nn = S.$('.snum', sc), big = S.$('.big', sc), sub = S.$('.sub', sc);
        if (nn) { tl.fromTo(nn, { yPercent: 40, autoAlpha: 0 }, { yPercent: 0, autoAlpha: .9, duration: .6, ease }, T0 + .2); mx(T0 + .8); }
        const te = mx(enterTitle(big, T0 + .35, b, 'mask'));
        if (sub) { rise(sub, Math.min(te, T0 + 1.2), { y: 1.4 * u }); mx(Math.min(te, T0 + 1.2) + .55); }
      }
      if (t === 'agenda') { const lis = S.$$('.ag li', sc); rise(lis, bodyAt, { y: 1.6 * u, stagger: .07 }); mx(bodyAt + .55 + S.stg(.07) * (lis.length - 1)); }
      if (t === 'bullets' || t === 'image') {
        const lis = S.$$('.bl li', sc), ptx = S.$('.ptx', sc);
        let at = bodyAt;
        if (ptx) { rise(ptx, at, { y: 1.6 * u }); at += .25; mx(at + .5); }
        if (lis.length) { tl.fromTo(lis, { x: -2.4 * u, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: .5, ease, stagger: S.stg(.12) }, at); mx(at + .5 + S.stg(.12) * (lis.length - 1)); }
        const ph = S.$('.ph', sc), img = S.$('.pimg', sc), cr = S.$('.credit', sc);
        if (ph) tl.fromTo(ph, { clipPath: sc.classList.contains('full') ? 'inset(0 0 0 0)' : 'inset(0 100% 0 0)', autoAlpha: sc.classList.contains('full') ? 0 : 1 }, { clipPath: 'inset(0 0% 0 0)', autoAlpha: 1, duration: .8, ease: inOut }, T0 - .1);
        if (img) tl.fromTo(img, { scale: 1.12 }, { scale: 1.02, duration: 1.6, ease: 'power2.out' }, T0 - .1);
        if (cr) fadeIn(cr, T0 + .6);
        if (ph) mx(T0 + .8);
      }
      if (t === 'cards') { const cds = S.$$('.cd', sc); tl.fromTo(cds, { y: 3 * u, autoAlpha: 0, scale: .97 }, { y: 0, autoAlpha: 1, scale: 1, duration: .6, ease, stagger: S.stg(.1) }, bodyAt); mx(bodyAt + .6 + S.stg(.1) * (cds.length - 1)); }
      if (t === 'statement') { const stm = S.$('.stm', sc), sub = S.$('.sub', sc); const te = mx(enterTitle(stm, T0 + .1, b, 'rise')); if (sub) { rise(sub, Math.min(te, T0 + 1.4), { y: 1.4 * u }); mx(Math.min(te, T0 + 1.4) + .55); } }
      if (t === 'number') {
        const n = S.$('.bign .n', sc), box = S.$('.bign', sc), lab = S.$('.nlab', sc), sub = S.$('.sub', sc), src = S.$('.src', sc);
        if (sub) fadeIn(sub, T0);
        fadeIn(box, T0 + .05, .3);
        const raw = str(b.number).replace(/,/g, ''), mm = /^-?\d+(\.\d+)?$/.test(raw);
        if (mm && b.count !== false) { const dec = (raw.split('.')[1] || '').length, plain = b.plain || /^(1[89]|20)\d\d$/.test(raw); mx(S.fx.num(n, T0 + .1, 1.2, parseFloat(raw), { decimals: dec, plain })); }
        if (lab) { rise(lab, T0 + .55, { y: 1.6 * u }); mx(T0 + 1.1); }
        if (src) { fadeIn(src, T0 + .9); mx(T0 + 1.3); }
      }
      if (t === 'stats') {
        S.$$('.st', sc).forEach((st, k) => {
          const at = bodyAt + k * S.stg(.14), n = S.$('.n', st);
          rise(st, at, { y: 2 * u });
          if (n) { const raw = n.dataset.v.replace(/,/g, ''); if (/^-?\d+(\.\d+)?$/.test(raw)) mx(S.fx.num(n, at + .05, 1, parseFloat(raw), { decimals: (raw.split('.')[1] || '').length, plain: /^(1[89]|20)\d\d$/.test(raw) })); }
          mx(at + .6);
        });
      }
      if (t === 'chart') {
        const base = S.$('.base', sc); if (base) tl.fromTo(base, { scaleX: 0 }, { scaleX: 1, duration: .5, ease }, bodyAt);
        S.$$('.bc', sc).forEach((bc, k) => {
          const tb = bodyAt + .15 + k * S.stg(.12);
          tl.fromTo(S.$('b', bc), { scaleY: 0 }, { scaleY: 1, duration: .7, ease }, tb);
          fadeIn(S.$('.bn', bc), tb);
          const vv = S.$('.v', bc), raw = vv.textContent, num = parseFloat(raw.replace(/,/g, ''));
          tl.fromTo(S.$('.bv', bc), { autoAlpha: 0, y: 1.4 * u }, { autoAlpha: 1, y: 0, duration: .4, ease }, tb + .25);
          if (/^-?[\d,]+(\.\d+)?$/.test(raw.trim()) && isFinite(num)) { const dec = (raw.split('.')[1] || '').length; S.fx.counter(vv, tb, .7, 0, num, { format: x => dec ? x.toFixed(dec) : Math.round(x).toLocaleString('ko-KR') }); }
          mx(tb + .75);
        });
      }
      if (t === 'compare') {
        const a = S.$('.side.a', sc), vs = S.$('.vs', sc), bb = S.$('.side.b', sc);
        if (a) { tl.fromTo(a, { x: -3 * u, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: .55, ease }, bodyAt); rise(S.$$('li', a), bodyAt + .2, { y: 1 * u, stagger: .06 }); }
        if (vs) tl.fromTo(vs, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: .45, ease: 'back.out(1.8)' }, bodyAt + .5);
        if (bb) { tl.fromTo(bb, { x: 3 * u, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: .55, ease }, bodyAt + .65); rise(S.$$('li', bb), bodyAt + .85, { y: 1 * u, stagger: .06 }); }
        if (a) tl.to(a, { opacity: .6, duration: .4, ease: 'power2.out' }, bodyAt + 1.1);
        mx(bodyAt + 1.5);
      }
      if (t === 'steps') {
        const sps = S.$$('.sp', sc), fill = S.$('.ln i', sc), gap = S.stg(.32);
        if (fill && sps.length > 1) tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: gap * (sps.length - 1), ease: 'none' }, bodyAt + .2);
        sps.forEach((sp, k) => { tl.fromTo(S.$('.dt', sp), { scale: 0 }, { scale: 1, duration: .4, ease: 'back.out(2)' }, bodyAt + .1 + k * gap); rise([...sp.children].slice(1), bodyAt + .2 + k * gap, { y: 1.4 * u, stagger: .06 }); });
        mx(bodyAt + .8 + gap * (sps.length - 1));
      }
      if (t === 'quote') {
        const qm = S.$('.qm', sc), qt = S.$('.qtx', sc), by = S.$('.qby', sc);
        if (qm) tl.fromTo(qm, { scale: .4, autoAlpha: 0, transformOrigin: '0 40%' }, { scale: 1, autoAlpha: 1, duration: .5, ease: 'back.out(1.6)' }, T0 + .1);
        const te = mx(enterTitle(qt, T0 + .3, b, 'rise'));
        if (by) { tl.fromTo(by, { x: -2 * u, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: .5, ease }, Math.min(te, T0 + 1.6)); mx(Math.min(te, T0 + 1.6) + .5); }
      }
      const src = S.$('.src', sc); if (src && t !== 'number') { fadeIn(src, end - .2); mx(end + .1); }
      return end + .12;
    }

    // 도형 첫 자리
    const s0 = slides[0], r0 = s0._slot || { left: W / 2, top: H / 2, width: 0, height: 0 };
    tl.set(mo, { left: r0.left, top: r0.top, height: r0.height, width: r0.width, borderRadius: moRad(s0._t), backgroundColor: moColor(s0._t) }, 0);
    if (moFull(s0._t)) tl.fromTo(mo, { clipPath: `circle(0% at 50% 50%)` }, { clipPath: 'circle(75% at 50% 50%)', duration: .8, ease: inOut }, 0);
    else tl.fromTo(mo, { width: 0 }, { width: r0.width, duration: .7, ease: inOut }, .1);
    tl.set(ft, { autoAlpha: showFoot(s0) ? 1 : 0 }, 0);

    els.forEach((sc, i) => {
      const b = slides[i], prev = i ? els[i - 1] : null, pb = i ? slides[i - 1] : null;
      starts.push(T);
      let T0 = T;
      if (prev) {
        // 앞 장 글이 빠지고, 도형이 다음 장 자리로 모양을 바꾸며 옮겨 감
        tl.to(S.$('.pg', prev), { autoAlpha: 0, y: -1.2 * u, duration: OUT, ease: 'power2.in' }, T);
        const pph = S.$('.ph', prev); if (pph) tl.to(pph, { autoAlpha: 0, duration: OUT, ease: 'power2.in' }, T);
        const r = b._slot || { left: S.W / 2, top: S.H / 2, width: 0, height: 0 };
        const fromFull = moFull(pb._t), toFull = moFull(b._t);
        tl.set(mo, { clipPath: 'none' }, T);
        tl.to(mo, { left: r.left, top: r.top, width: r.width, height: r.height, borderRadius: moRad(b._t), backgroundColor: moColor(b._t), duration: toFull || fromFull ? .8 : .7, ease: inOut }, T + (toFull ? .05 : .12));
        if (!b._slot) tl.to(mo, { autoAlpha: 0, duration: .3 }, T); else if (!pb._slot) tl.to(mo, { autoAlpha: 1, duration: .3 }, T + .2);
        tl.set(prev, { autoAlpha: 0 }, T + OUT);
        tl.set(sc, { autoAlpha: 1 }, T + OUT);
        tl.set(S.$('.pg', sc), { autoAlpha: 1, y: 0 }, T + OUT);
        if (showFoot(b) !== showFoot(pb)) tl.to(ft, { autoAlpha: showFoot(b) ? 1 : 0, duration: .35 }, T + .1);
        T0 = T + OUT + (toFull || fromFull ? .32 : .12);
      } else tl.set(sc, { autoAlpha: 1 }, 0);
      enter.push(T0 - .05);
      const end = enterSlide(sc, b, T0);
      stops.push(end);
      T = end + .001;
    });
    // 바닥글 장 번호 (시간의 함수)
    const nPad = String(slides.length).length < 2 ? 2 : String(slides.length).length;
    S.ambient(tt => { let k = 0; for (let i = 0; i < starts.length; i++) if (tt >= starts[i] + OUT) k = i; const v = String(k + 1).padStart(nPad, '0'); if (ftNo.textContent !== v) ftNo.textContent = v; });
    // 느린 배경 (장이 멈춰 있어도 숨 쉬듯)
    S.$$('.mesh').forEach(ms => { const bs = S.$$('b', ms), fast = ms.classList.contains('aurora') ? 1.6 : 1; S.idle(it => bs.forEach((bb, j) => { const a = it * .16 * fast + j * 2.1; bb.style.left = (16 + j * 24 + Math.sin(a) * 12).toFixed(2) + '%'; bb.style.top = (12 + j * 22 + Math.cos(a * .8 + j) * 10).toFixed(2) + '%'; })); });
    const orb = S.$('.orb'); if (orb) S.idle(it => { orb.style.scale = (1 + .06 * Math.sin(it * .9)).toFixed(4); });
    const rings = S.$('.rings'); if (rings) S.idle(it => { rings.style.rotate = (it * 3).toFixed(2) + 'deg'; });
    const pat = S.$('.pat'); if (pat && !frame) S.idle(it => { pat.style.transform = `translate(${((it * 6) % (7 * u)).toFixed(1)}px, 0)`; });

    const pr = S.$('#fx-prog'); if (pr) pr.remove();   // 진행 막대 대신 바닥글 장 번호
    S.stops = stops; S.stopEnter = enter; S.stopStarts = starts;
    S.setDuration(T + .5);
  });
})();
</script>
