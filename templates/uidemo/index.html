      M.camera(world, c[0], c[1], c[2]);
      hz.forEach(o => { o.el.style.transform = `translate(${px(o.x + Math.sin(t * .23 + o.ph) * 6 * u)}, ${px(o.y + Math.cos(t * .19 + o.ph) * 5 * u)}) scale(${(1 + Math.sin(t * .15 + o.ph) * .06).toFixed(4)})`; });

      // 앱이 떠오름
      const a0 = ent(t, 0, .6);
      app.style.opacity = clamp(a0 * 1.8).toFixed(3);
      app.style.transform = `translateY(${px((1 - a0) * 5 * u)}) scale(${(.97 + .03 * a0).toFixed(4)})`;

      // 꼬리표: 창 위 탭이 톡, 폰은 입력창 위 배지
      if (tabEl) { const k = clamp(M.spring(t - .3, 'snappy'), 0, 1.1); tabEl.style.transform = `scale(${(.6 + .4 * k).toFixed(4)})`; tabEl.style.opacity = clamp(k * 2).toFixed(3); }
      if (kb) {
        const k = ent(t, .3, .5), ko = N ? E.inCubic(prog(t, T.send + .05, .25)) : 0;
        kb.style.opacity = (clamp(k * 1.5) * (1 - ko)).toFixed(3);
        kb.style.transform = `translateY(${px((1 - k) * 2 * u - ko * 3 * u)})`;
      }

      // 메뉴 선택 표시가 미끄러짐
      const nk = M.anim(NAVK, t, 'snappy'), nOn = M.at(NAVK, t);
      if (navSel) navSel.style.transform = `translateY(${px(nk * navStep)})`;
      if (segSel) segSel.style.transform = `translateX(${px(nk * navStep)})`;
      NAV.forEach((n, k) => n.el.classList.toggle('on', k === nOn));

      // 화면(pane) 바꾸기: 옆으로 밀려 들어오고 나감
      PANES.forEach(p => {
        const kin = p.tin < 0 ? 1 : ent(t, p.tin, .5);
        const kout = p.tout == null ? 0 : E.inCubic(prog(t, p.tout - .05, .3));
        const vis = (p.tin < 0 || t >= p.tin) && kout < 1;
        p.el.style.visibility = vis ? 'inherit' : 'hidden';
        p.el.style.opacity = (Math.min(1, kin * 1.4) * (1 - kout)).toFixed(3);
        p.el.style.transform = `translateX(${px(((1 - kin) * 7 - kout * 5) * u)})`;
      });

      // 입력창: 누르면 테두리가 켜지고, 보내면 말풍선이 되어 위로
      const fk = N ? clamp(M.spring(t - T.fly, { f: 2.2, z: .9 }), 0, 1.02) : 0;
      inp.style.transform = `translate(${px((IN2.x - IN1.x) * fk)}, ${px((IN2.y - IN1.y) * fk)}) scale(${lerp(1, sb, fk).toFixed(4)})`;
      inp.style.height = px(lerp(inH1, inH2, clamp(fk)));
      ringEl.style.opacity = (prog(t, T.click1, .15) * (1 - prog(t, T.send + .05, .25))).toFixed(3);
      ibg.style.opacity = clamp(fk).toFixed(3);
      ift.style.opacity = (1 - (N ? prog(t, T.send + .08, .2) : 0)).toFixed(3);
      sendEl.style.transform = `scale(${(1 - .14 * press(t, T.send)).toFixed(4)})`;
      const caret = S.$('.caret', ttl);   // 엔진이 타자 칠 때 넣는 커서 (보낸 뒤에는 숨김)
      if (caret) caret.style.visibility = t >= T.send ? 'hidden' : '';
      if (kbd) {
        const k = clamp(M.spring(t - kbdIn, 'snappy') - M.spring(t - kbdOut, { f: 2.4, z: 1 }), 0, 1.02);
        kbd.style.transform = `translateY(${px((1 - k) * kbdH)})`;
        kbd.style.visibility = k > .001 ? 'inherit' : 'hidden';
      }
      if (cmp) { const k = ent(t, T.send + .5, .45); cmp.style.opacity = clamp(k * 1.5).toFixed(3); cmp.style.transform = `translateY(${px((1 - k) * 3 * u)})`; }

      // 결과 목록: 뼈대 줄 → AI 커서가 지나가면 항목 → 커서가 체크
      rows.forEach((o, i) => {
        const a = ent(t, sk0 + S.stg(.07) * i, .5);
        o.el.style.visibility = a > 0 ? 'inherit' : 'hidden';
        o.el.style.opacity = clamp(a * 1.5).toFixed(3);
        o.el.style.transform = `translateY(${px((1 - a) * 3 * u)})`;
        const tr = T.res(i), rk = prog(t, tr, .3);
        o.sk.style.opacity = (1 - prog(t, tr - .02, .18)).toFixed(3);
        const sh = ((t * .8 + i * .17) % 1);
        o.skb.forEach(b => b.style.backgroundPosition = `${(100 - sh * 100).toFixed(1)}% 0`);
        o.rfl.style.opacity = (prog(t, tr - .12, .12) * (1 - prog(t, tr + .18, .35))).toFixed(3);
        const tk = T.chk(i), ck = t >= tk ? clamp(M.spring(t - tk, 'pop'), 0, 1.2) : 0;
        o.tx.style.opacity = (rk * (.62 + .38 * clamp(ck))).toFixed(3);
        o.tx.style.transform = `translateY(${px((1 - E.outCubic(rk)) * 1.2 * u)})`;
        o.cbx.style.opacity = rk.toFixed(3);
        o.cbx.style.transform = `scale(${(1 - .12 * press(t, tk)).toFixed(4)})`;
        o.cbf.style.visibility = t >= tk ? 'inherit' : 'hidden';
        o.cbf.style.transform = `scale(${ck.toFixed(4)})`;
        M.draw(o.ckp, E.outCubic(prog(t, tk + .06, .28)));
        o.rbg.style.opacity = (.75 * clamp(ck)).toFixed(3);
      });
      if (N) {
        const ao = prog(t, T.ai0 - .35, .2) * (1 - prog(t, T.res(N - 1) + .4, .25));
        const [ax, ay] = aiAt(t);
        aic.style.visibility = ao > .001 ? 'inherit' : 'hidden';
        aic.style.opacity = ao.toFixed(3);
        aic.style.transform = `translate(${px(ax)}, ${px(ay)})`;
        aicD.forEach((d, j) => d.style.opacity = (.35 + .65 * (.5 + .5 * Math.sin(t * 9 - j * .9))).toFixed(3));
      }

      // 대시보드: 카드 → 그래프가 그려지고 숫자가 올라감
      if (num) {
        const a = ent(t, T.kpi, .6);
        kpi.style.opacity = clamp(a * 1.5).toFixed(3);
        kpi.style.transform = `translateY(${px((1 - a) * 4 * u)})`;
        dash.minis.forEach((m, j) => { const b = ent(t, T.kpi + S.stg(.12) * (j + 1), .6); m.style.opacity = clamp(b * 1.5).toFixed(3); m.style.transform = `translateY(${px((1 - b) * 4 * u)})`;
          S.$$('.mbar', m).forEach((bar, i) => bar.style.transform = `scaleY(${E.outCubic(prog(t, T.kpi + .3 + j * .1 + i * .05, .5)).toFixed(4)})`); });
        if (dash.klb) dash.klb.style.opacity = ent(t, T.kpi + .2, .4).toFixed(3);
        const nk = ent(t, T.num0 - .1, .35);
        dash.knr.style.opacity = clamp(nk * 1.5).toFixed(3);
        dash.knr.style.transform = `translateY(${px((1 - nk) * 1.5 * u)})`;
        if (dash.showChart) {
          const ck = E.inOutCubic(prog(t, T.chart0, 1.1));
          M.draw(dash.ln, ck);
          dash.clip.setAttribute('width', (dash.iw * ck + 2).toFixed(1));   // 넓이는 선이 그려진 만큼만
          const dk = clamp(M.spring(t - (T.chart0 + 1.05), 'pop'), 0, 1.2);
          dash.pd.style.transform = `scale(${dk.toFixed(4)})`; dash.pd.style.transformBox = 'fill-box'; dash.pd.style.transformOrigin = '50% 50%';
          const pk = t > T.chart0 + 1.05 ? ((t - T.chart0 - 1.05) % 1.4) / 1.4 : 0;
          dash.pr.setAttribute('r', (1.1 * u + pk * 3.4 * u).toFixed(1));
          dash.pr.style.opacity = t > T.chart0 + 1.05 ? ((1 - pk) * .6).toFixed(3) : '0';
        }
        if (dash.ksrc) dash.ksrc.style.opacity = ent(t, T.num0 + .9, .45).toFixed(3);
      }

      // 갤러리: 한 무더기로 들어와 칸으로 펼쳐짐 → 커서가 한 장을 고름
      phs.forEach((o, i) => {
        const a = ent(t, T.gIn + .12 + i * S.stg(.08), .45);
        const k = clamp(M.spring(t - (T.spread + i * S.stg(.1)), 'snappy'), 0, 1.06);
        const sel = i === 0 ? clamp(M.spring(t - T.gsel, 'snappy'), 0, 1.1) : 0;
        const s = lerp(o.ss, 1, k) * (1 + .025 * sel - .03 * (i === 0 ? press(t, T.gsel) : 0));
        o.el.style.transform = `translate(${px(o.sx * (1 - k))}, ${px((o.sy + (1 - a) * 6 * u) * (1 - k))}) rotate(${(o.sr * (1 - k)).toFixed(3)}deg) scale(${s.toFixed(4)})`;
        o.el.style.opacity = clamp(a * 1.5).toFixed(3);
        o.el.style.zIndex = i === 0 && t >= T.gsel ? 5 : '';
        if (o.img) o.img.style.transform = `scale(${(1.1 - .08 * prog(t, T.gIn, 4)).toFixed(4)})`;
        o.sel.style.opacity = (i === 0 ? prog(t, T.gsel, .15) : 0).toFixed(3);
      });

      // 마지막: 버튼을 누르면 체크 + 토스트, 카메라가 빠지며 로고·sub
      if (btn) {
        const b = clamp(M.spring(t - T.btn, 'pop'), 0, 1.15);
        btn.style.opacity = clamp(b * 2).toFixed(3);
        btn.style.transform = `scale(${((.7 + .3 * b) * (1 - .07 * press(t, T.cc))).toFixed(4)})`;
        const ck = t >= T.cc + .1 ? clamp(M.spring(t - (T.cc + .1), 'snappy'), 0, 1.04) : 0;
        bck.style.width = px(ckW * ck); bck.style.marginRight = px(ckG * ck); bck.style.opacity = clamp(ck).toFixed(3);
      }
      if (toast) {
        const tk = M.inout(t, T.cc + .25, T.cc + 1.7, 'smooth', .35);
        const y = tk <= 1 ? (1 - tk) * -4 * u : -(tk - 1) * 4 * u;
        toast.style.visibility = tk > .001 && tk < 2 ? 'inherit' : 'hidden';
        toast.style.opacity = (tk <= 1 ? clamp(tk * 2) : 1 - clamp(tk - 1)).toFixed(3);
        toast.style.transform = `translate(-50%, ${px(y)})`;
      }
      { const k = ent(t, T.lock, .55); clg.style.opacity = clamp(k * 1.5).toFixed(3); clg.style.transform = `translateY(${px((1 - k) * 2.4 * u)})`; }
      if (csub) { const k = ent(t, T.lock + .2, .5); csub.style.opacity = clamp(k * 1.5).toFixed(3); csub.style.transform = `translateY(${px((1 - k) * 1.6 * u)})`; }
      if (cnote) cnote.style.opacity = ent(t, T.lock + .4, .5).toFixed(3);

      // 커서
      const [cx, cy2] = curAt(t), cs = M.cursorAt([[0, 0, 0]], CLK, t);
      cur.set(cx, cy2, { down: cs.down, ring: cs.ring, hand: HAND.some(([a, b]) => t >= a && t < b), o: clamp((t - .15) * 4) });
    });
  });
})();
</script>
