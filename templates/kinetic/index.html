<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== kinetic 템플릿: 사진 없이 글자만으로 끌고 가는 광고 (세일·이벤트·공지·신메뉴) =====
   beats(짧은 문장 장면)를 차례로 보여 주고 CTA로 끝납니다. 장면마다 색 조합(scheme)을 번갈아 씁니다. */
.pat { position: absolute; inset: -10%; pointer-events: none; }
.pat.dots { background-image: radial-gradient(circle, var(--pat) 0 calc(var(--u) * .45), transparent calc(var(--u) * .5)); background-size: calc(var(--u) * 6) calc(var(--u) * 6); }
.pat.grid { background-image: linear-gradient(var(--pat) 1px, transparent 1px), linear-gradient(90deg, var(--pat) 1px, transparent 1px); background-size: calc(var(--u) * 8) calc(var(--u) * 8); }
.pat.rays { left: 50%; top: 50%; width: 300%; height: 300%; margin: -150% 0 0 -150%; inset: auto; background: repeating-conic-gradient(from 0deg, var(--pat) 0 6deg, transparent 6deg 15deg); }
.glow { position: absolute; width: 120%; aspect-ratio: 1; left: -10%; top: 30%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; }

/* 색 조합: dark(브랜드 배경) / accent(강조색 바탕) / paper(밝은 바탕) */
.scene { --fg: var(--on-bg); --hl: var(--accent); --mkc: var(--accent); --pat: var(--pattern); background: var(--bg); color: var(--fg); }
.scene.s-accent { background: var(--accent); --fg: var(--accent-ink); --hl: var(--bg); --mkc: var(--mark-on-accent, rgba(255,255,255,.6)); --pat: rgba(0, 0, 0, .08); }
.scene.s-paper { background: var(--paper); --fg: var(--ink); --hl: var(--accent); --pat: rgba(0, 0, 0, .06); }
.scene.s-accent .glow, .scene.s-paper .glow { display: none; }
.scene .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene .bgshade { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
.scene.has-img { --fg: #fff; --hl: var(--accent); }

.beat .safe { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: calc(var(--u) * 3.6); }
.kick { display: inline-flex; background: var(--hl); color: var(--bg); font: 800 calc(var(--u) * 3.8)/1 var(--font-body); padding: calc(var(--u) * 1.6) calc(var(--u) * 3.2) calc(var(--u) * 1.9); border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.s-paper .kick, .has-img .kick { color: var(--accent-ink); }
.s-accent .kick { color: var(--accent); }
.bigtxt { font: 900 calc(var(--u) * 16)/1.12 var(--font-heading); letter-spacing: -.04em; margin: 0; white-space: pre-line; word-break: keep-all; width: 100%; color: var(--fg); }
.bigtxt .wd.hl { color: var(--hl); }
.linetxt { font: 900 calc(var(--u) * 10)/1.18 var(--font-heading); letter-spacing: -.03em; margin: 0; white-space: pre-line; word-break: keep-all; width: 100%; color: var(--fg); }
.linetxt .mark { --accent: var(--mkc); }
.small { font: 600 calc(var(--u) * 4.4)/1.4 var(--font-body); opacity: .82; margin: 0; white-space: pre-line; word-break: keep-all; color: var(--fg); }
.num { font: 900 calc(var(--u) * 34)/.9 var(--font-display); letter-spacing: -.05em; color: var(--hl); white-space: nowrap; font-variant-numeric: tabular-nums; }
.num small { font-size: .36em; letter-spacing: 0; margin-left: .06em; color: var(--fg); }
.num .pre { font-size: .36em; letter-spacing: 0; margin-right: .1em; color: var(--fg); }
.ltitle { font: 900 calc(var(--u) * 8)/1.15 var(--font-heading); letter-spacing: -.03em; margin: 0; white-space: pre-line; word-break: keep-all; color: var(--fg); width: 100%; }
.litems { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 2.6); align-items: stretch; text-align: left; }
.litems li { display: flex; align-items: center; gap: calc(var(--u) * 2.8); font: 800 calc(var(--u) * 5.6)/1.25 var(--font-body); color: var(--fg); word-break: keep-all; }
.litems li b { flex: none; width: calc(var(--u) * 8.6); height: calc(var(--u) * 8.6); border-radius: calc(var(--u) * 2.2); background: var(--hl); color: var(--bg); display: grid; place-items: center; font: 900 calc(var(--u) * 4.4)/1 var(--font-display); }
.s-paper .litems li b, .has-img .litems li b { color: var(--accent-ink); }
.s-accent .litems li b { color: var(--accent); }

/* cta */
#sc-cta .safe { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: calc(var(--u) * 4.2); }
.logo { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.4); }
.logo img { height: calc(var(--u) * 14); width: auto; }
.logo .lt { font: 900 calc(var(--u) * 13)/.9 var(--font-display); color: var(--accent); letter-spacing: .02em; white-space: nowrap; }
.logo .ls { font: 700 calc(var(--u) * 3.2)/1 var(--font-display); color: var(--on-bg); letter-spacing: .3em; padding-left: .3em; white-space: nowrap; }
#sc-cta .headline { font: 900 calc(var(--u) * 8.5)/1.16 var(--font-heading); color: var(--on-bg); letter-spacing: -.035em; white-space: pre-line; word-break: keep-all; margin: 0; width: 100%; }
.btn { display: inline-flex; align-items: center; gap: calc(var(--u) * 2); background: var(--accent); color: var(--accent-ink); font: 900 calc(var(--u) * 5)/1 var(--font-body); padding: calc(var(--u) * 3) calc(var(--u) * 5.4) calc(var(--u) * 3.3); border-radius: 999px; box-shadow: 0 calc(var(--u) * 1) 0 rgba(0,0,0,.22); white-space: nowrap; }
.btn svg { width: 1em; height: 1em; fill: currentColor; }
.handle { font: 700 calc(var(--u) * 3.6)/1.3 var(--font-body); color: var(--on-bg-muted); white-space: pre-line; }
#sc-cta .mascot { position: absolute; z-index: 3; }
.mascot img { width: 100%; height: auto; }
.mascot.below { left: 0; right: 0; display: flex; align-items: flex-start; justify-content: center; }
.mascot.below img { height: 100%; width: auto; }
[data-format="tall"] #sc-cta.has-mascot .safe { justify-content: flex-start; padding-top: 2%; }
[data-format="portrait"] #sc-cta .mascot, [data-format="square"] #sc-cta .mascot { display: none; }
[data-format="wide"] #sc-cta .mascot { height: 70%; left: 5%; bottom: 0; }
[data-format="wide"] #sc-cta .mascot img { height: 100%; width: auto; }
[data-format="wide"] .litems li { font-size: calc(var(--u) * 6.6); }
[data-format="wide"] .beat .safe { left: calc(var(--safe-l) + 6%); right: calc(var(--safe-r) + 6%); }
</style>

<div id="viewport"><div id="stage"><div id="cam"></div></div></div>

<script>/*@GSAP@*/</script>
<script>/*@DATA@*/</script>
<script>/*@ENGINE_JS@*/</script>
<script>
(function () {
  const S = Studio, C = S.content, B = S.brand, e = S.esc;
  const cam = S.$('#cam');
  const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>';
  const pattern = B.pattern || 'dots';
  const mascotKey = C.mascot === false ? null : (C.mascot || B.mascot);
  const SCHEMES = C.schemes || ['dark', 'accent', 'dark', 'paper'];

  const scenes = [], beats = C.beats || [];
  const add = (html) => { const el = S.h(html); cam.appendChild(el); scenes.push(el); return el; };

  beats.forEach((b, i) => {
    const type = b.type || (b.number != null ? 'number' : b.items ? 'list' : (b.text || '').length > 18 ? 'line' : 'big');
    b._type = type;
    const scheme = b.image ? 'img' : (b.scheme || SCHEMES[i % SCHEMES.length]);
    let inner = '';
    if (b.kicker) inner += `<div class="kick">${e(b.kicker)}</div>`;
    if (type === 'big') inner += `<h2 class="bigtxt">${e(b.text || '')}</h2>`;
    if (type === 'line') inner += `<h2 class="linetxt">${e(b.text || '')}</h2>`;
    if (type === 'number') inner += `<div class="num">${b.prefix ? `<span class="pre">${e(b.prefix)}</span>` : ''}<span class="n">${e(b.number)}</span><small>${e(b.suffix || '')}</small></div>`;
    if (type === 'list') inner += `<h2 class="ltitle">${e(b.text || '')}</h2><ol class="litems">${(b.items || []).map((t, k) => `<li><b>${k + 1}</b><span>${e(t)}</span></li>`).join('')}</ol>`;
    if (b.sub) inner += `<p class="small">${e(b.sub)}</p>`;
    add(`<section class="scene beat ${scheme === 'img' ? 'has-img' : 's-' + e(scheme)}" data-i="${i}">
      ${b.image ? `<img class="bgimg" src="${S.img(b.image)}" alt=""><div class="bgshade"></div>` : `<div class="pat ${e(pattern)}"></div><div class="glow"></div>`}
      <div class="safe">${inner}</div>
    </section>`);
  });

  const cta = C.cta || {};
  const logoImg = B.logo && S.img(B.logo);
  const ctaMascot = !!(mascotKey && S.img(mascotKey) && C.ctaMascot !== false);
  add(`<section class="scene${ctaMascot ? ' has-mascot' : ''}" id="sc-cta"><div class="pat ${e(pattern)}"></div><div class="glow"></div><div class="safe">
    <div class="logo">${logoImg ? `<img src="${logoImg}" alt="">` : ''}${B.logoText ? `<div class="lt">${e(B.logoText)}</div>` : ''}${B.logoSub ? `<div class="ls">${e(B.logoSub)}</div>` : ''}</div>
    ${cta.headline ? `<h2 class="headline">${e(cta.headline)}</h2>` : ''}
    ${cta.button ? `<div class="btn"><span>${e(cta.button)}</span>${ARROW}</div>` : ''}
    ${cta.sub ? `<div class="handle">${e(cta.sub)}</div>` : ''}
  </div>
  ${ctaMascot ? `<div class="mascot"><img src="${S.img(mascotKey)}" alt=""></div>` : ''}
  </section>`);

  S.start(S => {
    const tl = S.tl, u = Math.min(S.W, S.H) / 100;
    const bigMax = { tall: 18, portrait: 17, square: 16, wide: 20 }[S.key];
    const lineMax = { tall: 10.5, portrait: 10, square: 9.5, wide: 12 }[S.key];
    S.$$('.bigtxt').forEach(el => S.fit(el, { max: bigMax * u, maxLines: 4 }));
    S.$$('.linetxt').forEach(el => S.fit(el, { max: lineMax * u, maxLines: 4 }));
    S.$$('.ltitle').forEach(el => S.fit(el, { max: (S.is('wide') ? 9.5 : 8) * u, maxLines: 2 }));
    S.$$('.num').forEach(el => S.fit(el, { max: 34 * u }));
    S.$$('#sc-cta .headline').forEach(el => S.fit(el, { max: 8.5 * u, maxLines: 3 }));
    const mas = S.$('#sc-cta .mascot');
    if (mas && S.is('tall')) {
      const safe = S.$('#sc-cta .safe'), last = safe.lastElementChild;
      const top = safe.offsetTop + last.offsetTop + last.offsetHeight + 3 * u;
      mas.classList.add('below');
      Object.assign(mas.style, { top: top + 'px', height: Math.min(.42 * S.H, Math.max(S.H - S.safe.bottom * .25 - top, 18 * u)) + 'px' });
    }

    const DEF = { big: 1.9, line: 2.6, number: 2.4, list: 3.4 };
    const durs = beats.map(b => b.dur || DEF[b._type]).concat([C.ctaDur || 3.4]);
    const starts = []; let t = 0;
    durs.forEach(d => { starts.push(t); t += d; });
    S.setDuration(t);
    tl.set(scenes[0], { autoAlpha: 1 }, 0);

    const cycle = ['push', 'wipe', 'zoom', 'push'];
    for (let i = 1; i < scenes.length; i++) {
      const isCta = i === scenes.length - 1;
      const kind = (beats[i] && beats[i].transition) || (isCta ? (C.ctaTransition || 'iris') : cycle[(i - 1) % cycle.length]);
      (S.tr[kind] || S.tr.wipe)(starts[i], scenes[i - 1], scenes[i]);
    }

    scenes.forEach((sc, i) => {
      const T0 = starts[i];
      const pat = S.$('.pat', sc);
      if (pat) S.ambient(tt => { pat.style.transform = pattern === 'rays' ? `rotate(${tt * 6}deg)` : `translate(${(tt * 18) % (6 * u)}px, ${(tt * 18) % (6 * u)}px)`; });
      const img = S.$('.bgimg', sc);
      if (img) S.fx.kenburns(img, T0 - .5, durs[i] + 1, { from: 1.15, to: 1.02 });
      const kick = S.$('.kick', sc); if (kick) S.fx.pop(kick, T0 + .05);
      const sub = S.$('.small', sc);

      if (sc.id === 'sc-cta') {
        const logo = S.$('.logo', sc), hl = S.$('.headline', sc), btn = S.$('.btn', sc), hd = S.$('.handle', sc), m = S.$('.mascot', sc);
        S.fx.pop(logo, T0 + .1, { from: .5 });
        if (hl) S.fx.rise(S.words(hl), T0 + .45, { stagger: .05 });
        if (btn) { S.fx.pop(btn, T0 + .9); S.ambient(tt => { if (tt > T0 + 1.4) btn.style.scale = (1 + .035 * Math.sin((tt - T0) * 6)).toFixed(4); }); }
        if (hd) S.fx.fade(hd, T0 + 1.2);
        if (m) { S.fx.rise(m, T0 + .3, { y: 300, d: .6 }); S.fx.bob(S.$('img', m), 5 * u / 10, .8, 1.3); }
        return;
      }
      const b = beats[+sc.dataset.i];
      if (b._type === 'big') {
        const el = S.$('.bigtxt', sc), ws = S.words(el);
        const hlw = new Set((b.highlight || '').split(/\s+/).filter(Boolean));
        ws.forEach(w => { if (hlw.has(w.textContent)) w.classList.add('hl'); });
        tl.fromTo(ws, { scale: 2.6, autoAlpha: 0, filter: 'blur(12px)' }, { scale: 1, autoAlpha: 1, filter: 'blur(0px)', duration: .38, ease: 'power4.out', stagger: .11 }, T0 + .02);
        S.fx.shake(T0 + .1 + .11 * Math.max(0, ws.length - 1), 7);
        S.ambient(tt => { if (tt > T0 && tt < T0 + durs[i] + .5) el.style.scale = (1 + (tt - T0) * .018).toFixed(4); });
      }
      if (b._type === 'line') {
        const el = S.$('.linetxt', sc), mark = S.mark(el, b.highlight);
        if (mark) S.fx.rise(el, T0 + .1, { y: 70 }); else S.fx.rise(S.words(el), T0 + .1, { y: 70, stagger: .06 });
        S.fx.marker(mark, T0 + .7);
      }
      if (b._type === 'number') {
        const box = S.$('.num', sc), n = S.$('.n', sc), raw = String(b.number).replace(/[^\d.]/g, '');
        S.fx.pop(box, T0 - .15, { from: .6 });
        if (raw && b.count !== false) S.fx.counter(n, T0 - .1, 1.1, b.from ?? 0, parseFloat(raw), { format: v => b.decimals ? v.toFixed(b.decimals) : b.plain ? String(Math.round(v)) : Math.round(v).toLocaleString('ko-KR') });
        S.fx.shake(T0 + 1.05, 8);
      }
      if (b._type === 'list') {
        S.fx.rise(S.$('.ltitle', sc), T0 + .05, { y: 50 });
        const lis = S.$$('li', sc);
        S.fx.slide(lis, T0 + .45, { dir: 'left', dist: 140, stagger: .3 });
        S.fx.pop(lis.map(li => li.querySelector('b')), T0 + .5, { stagger: .3 });
      }
      if (sub) S.fx.rise(sub, T0 + (b._type === 'list' ? 1.4 : .75), { y: 30, ease: 'power3.out' });
    });
  });
})();
</script>
