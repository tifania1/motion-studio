<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== sale 템플릿: 세일 =====
   강조색 판 위로 비스듬한 띠가 흐르고(마퀴), 숫자가 슬롯처럼 굴러 꽂히고, 가격표에 줄이 그어지며 새 가격이 떨어지는 16초 영상. */
#sale { position: absolute; inset: 0; background: var(--accent); overflow: hidden; }
#inv { position: absolute; inset: 0; background: var(--ink); }
.abs { position: absolute; left: 0; top: 0; }
.band { position: absolute; left: -30%; width: 160%; height: calc(var(--u) * 10); background: var(--ink); overflow: hidden; display: flex; align-items: center; }
.band.alt { background: var(--paper); }
.band .track { display: flex; white-space: nowrap; will-change: transform; }
.band .track span { font: 900 calc(var(--u) * 6.4)/1 "Archivo", var(--font-display); font-stretch: 70%; color: var(--accent); letter-spacing: .02em; padding: 0 calc(var(--u) * 2.2); text-transform: uppercase; }
.band.alt .track span { color: var(--ink); }
.band .track span.k { font-family: var(--font-heading); font-stretch: 100%; letter-spacing: -.02em; }
.hk { text-align: center; }
.hk .tg { display: inline-block; font: 900 calc(var(--u) * 4)/1 var(--font-body); background: var(--ink); color: var(--paper); padding: calc(var(--u) * 1.7) calc(var(--u) * 3.2) calc(var(--u) * 1.9); border-radius: calc(var(--u) * .8); margin-bottom: calc(var(--u) * 3); transform: rotate(-3deg); }
.hk h1 { font: 900 calc(var(--u) * 17)/1.02 var(--font-heading); color: var(--ink); letter-spacing: -.05em; margin: 0; white-space: pre-line; word-break: keep-all; }
#pct { display: flex; flex-direction: column; align-items: center; }
#pct .pre { font: 900 calc(var(--u) * 6)/1 var(--font-heading); color: var(--ink); letter-spacing: -.03em; margin-bottom: calc(var(--u) * 1); }
#pct .row { display: flex; align-items: flex-start; }
#pct .dig { height: 1em; overflow: hidden; font: 900 calc(var(--u) * 46)/1 "Archivo", var(--font-display); font-stretch: 62%; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
#pct .dig .col { display: flex; flex-direction: column; }
#pct .dig .col i { font-style: normal; height: 1em; display: block; text-align: center; }
#pct .unit { font: 900 calc(var(--u) * 20)/1 "Archivo", var(--font-display); font-stretch: 62%; color: var(--ink); margin-top: calc(var(--u) * 3); }
#pct .off { font: 900 calc(var(--u) * 8)/1 "Archivo", var(--font-display); font-stretch: 100%; color: var(--paper); background: var(--ink); padding: calc(var(--u) * 1.2) calc(var(--u) * 3) calc(var(--u) * 1.4); transform: rotate(-4deg); margin-top: calc(var(--u) * -1); letter-spacing: .04em; }
.card { width: calc(var(--u) * 80); background: var(--paper); color: var(--ink); border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 5) calc(var(--u) * 5.4) calc(var(--u) * 5); box-shadow: calc(var(--u) * 1.6) calc(var(--u) * 1.8) 0 var(--ink); box-sizing: border-box; }
.card .nm { font: 900 calc(var(--u) * 6.2)/1.15 var(--font-heading); letter-spacing: -.03em; word-break: keep-all; white-space: pre-line; }
.card .prices { display: flex; align-items: center; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 4); flex-wrap: wrap; }
.card .old { position: relative; font: 800 calc(var(--u) * 5.2)/1 "Archivo", var(--font-body); font-stretch: 85%; opacity: .55; white-space: nowrap; }
.card .old .strike { position: absolute; left: -6%; right: -6%; top: 52%; height: calc(var(--u) * .9); background: var(--ink); transform-origin: 0 50%; border-radius: 99px; }
.card .arr { width: calc(var(--u) * 5); height: calc(var(--u) * 5); fill: var(--ink); opacity: .7; flex: none; }
.card .new { position: relative; font: 900 calc(var(--u) * 11)/1 "Archivo", var(--font-display); font-stretch: 80%; white-space: nowrap; letter-spacing: -.02em; z-index: 0; }
.card .new::after { content: ""; position: absolute; left: -4%; right: -4%; bottom: 4%; height: 32%; background: var(--accent); z-index: -1; border-radius: 4px; }
.badge { width: calc(var(--u) * 20); height: calc(var(--u) * 20); border-radius: 50%; background: var(--ink); color: var(--accent); display: grid; place-items: center; font: 900 calc(var(--u) * 6.4)/1 "Archivo", var(--font-display); font-stretch: 80%; letter-spacing: -.02em; }
.badge::before { content: ""; position: absolute; inset: calc(var(--u) * 1.2); border: calc(var(--u) * .4) dashed var(--accent); border-radius: 50%; opacity: .7; }
#period { text-align: center; }
#period .lb { font: 800 calc(var(--u) * 4)/1 var(--font-body); color: var(--ink); opacity: .75; margin-bottom: calc(var(--u) * 2); }
#period .dt { font: 900 calc(var(--u) * 15)/1 "Archivo", var(--font-display); font-stretch: 62%; color: var(--ink); white-space: nowrap; letter-spacing: -.01em; }
#period .chip { display: inline-block; margin-top: calc(var(--u) * 3); font: 900 calc(var(--u) * 6)/1 var(--font-heading); color: var(--accent); background: var(--ink); padding: calc(var(--u) * 2) calc(var(--u) * 4.4) calc(var(--u) * 2.3); border-radius: 999px; }
#period ul { list-style: none; margin: calc(var(--u) * 4) 0 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
#period li { font: 700 calc(var(--u) * 4.2)/1.3 var(--font-body); color: var(--ink); }
#period li::before { content: "· "; }
.ctabox { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 3.6); text-align: center; }
.logo { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.2); }
.logo img { height: calc(var(--u) * 12); width: auto; }
.logo .lt { font: 900 calc(var(--u) * 10)/.9 var(--font-display); color: var(--accent); white-space: nowrap; }
.logo .ls { font: 700 calc(var(--u) * 2.8)/1 var(--font-display); color: var(--paper); letter-spacing: .3em; white-space: nowrap; }
.chead { font: 900 calc(var(--u) * 9)/1.12 var(--font-heading); color: var(--paper); letter-spacing: -.04em; white-space: pre-line; word-break: keep-all; margin: 0; }
.btn { display: inline-flex; align-items: center; gap: calc(var(--u) * 2); background: var(--accent); color: var(--accent-ink); font: 900 calc(var(--u) * 5)/1 var(--font-body); padding: calc(var(--u) * 3) calc(var(--u) * 5.4) calc(var(--u) * 3.3); border-radius: calc(var(--u) * 1.4); white-space: nowrap; }
.btn svg { width: 1em; height: 1em; fill: currentColor; }
.handle { font: 700 calc(var(--u) * 3.4)/1.3 var(--font-body); color: var(--paper); opacity: .75; white-space: pre-line; }
</style>

<div id="viewport"><div id="stage"><div id="cam"></div></div></div>

<script>/*@GSAP@*/</script>
<script>/*@DATA@*/</script>
<script>/*@ENGINE_JS@*/</script>
<script>
(function () {
  const S = Studio, M = S.M, C = S.content, B = S.brand, e = S.esc;
  const cam = S.$('#cam');
  const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>';
  const items = (C.items || []).slice(0, 3);
  const cta = C.cta || {};
  const pctStr = String(C.percent ?? '').replace(/[^\d]/g, '');
  const word = C.marquee || 'SALE';
  const logoImg = B.logo && S.img(B.logo);
  const bandText = alt => Array.from({ length: 14 }, (_, i) => i % 3 === 1 && C.tag ? `<span class="k">${e(C.tag)}</span>` : `<span>${e(alt && pctStr ? `${pctStr}${C.unit || '%'} ${C.off || 'OFF'}` : word)}</span>`).join('');

  cam.appendChild(S.h(`<div id="sale">
    <div id="inv"></div>
    <div class="band" id="b1"><div class="track">${bandText(false)}${bandText(false)}</div></div>
    <div class="band alt" id="b2"><div class="track">${bandText(true)}${bandText(true)}</div></div>
    <div class="band" id="b3"><div class="track">${bandText(true)}${bandText(true)}</div></div>
    <div id="hk" class="abs hk">${C.tag ? `<div class="tg">${e(C.tag)}</div>` : ''}<h1>${e(C.headline || C.tag || '')}</h1></div>
    <div id="pct" class="abs">${C.prefix ? `<div class="pre">${e(C.prefix)}</div>` : ''}
      <div class="row">${[...pctStr].map(() => `<div class="dig"><div class="col">${Array.from({ length: 30 }, (_, k) => `<i>${k % 10}</i>`).join('')}</div></div>`).join('')}<div class="unit">${e(C.unit || '%')}</div></div>
      ${C.off !== '' ? `<div class="off">${e(C.off || 'OFF')}</div>` : ''}</div>
    ${items.map((it, i) => `<div class="card abs" data-i="${i}"><div class="nm">${e(it[0] || '')}</div><div class="prices">${it[1] ? `<span class="old">${e(it[1])}<i class="strike"></i></span><svg class="arr" viewBox="0 0 24 24"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>` : ''}<span class="new">${e(it[2] || '')}</span></div></div>
      ${it[3] ? `<div class="badge abs" data-i="${i}">${e(it[3])}</div>` : ''}`).join('')}
    <div id="period" class="abs">${C.periodLabel !== '' ? `<div class="lb">${e(C.periodLabel || '세일 기간')}</div>` : ''}<div class="dt">${e(C.period || '')}</div>${C.periodNote ? `<div class="chip">${e(C.periodNote)}</div>` : ''}
      ${(C.conds || []).length ? `<ul>${C.conds.map(x => `<li>${e(x)}</li>`).join('')}</ul>` : ''}</div>
    <div id="ctabox" class="abs ctabox">
      <div class="logo">${logoImg ? `<img src="${logoImg}" alt="">` : ''}${B.logoText ? `<div class="lt">${e(B.logoText)}</div>` : ''}${B.logoSub ? `<div class="ls">${e(B.logoSub)}</div>` : ''}</div>
      ${cta.headline ? `<h2 class="chead">${e(cta.headline)}</h2>` : ''}
      ${cta.button ? `<div class="btn"><span>${e(cta.button)}</span>${ARROW}</div>` : ''}
      ${cta.sub ? `<div class="handle">${e(cta.sub)}</div>` : ''}
    </div>
  </div>`));

  S.start(S => {
    const W = S.W, H = S.H, u = Math.min(W, H) / 100, sf = S.safe;
    const sx = sf.left, sy = sf.top, sw = W - sf.left - sf.right, sh = H - sf.top - sf.bottom;
    const cx = sx + sw / 2, cy = sy + sh / 2;
    const wide = S.is('wide'), tall = S.is('tall');
    const fitW = el => { el.style.width = Math.min(sw * .94, wide ? sw * .7 : sw) + 'px'; };
    const hk = S.$('#hk'); fitW(hk); S.fit(S.$('h1', hk), { max: (wide ? 15 : 17) * u, maxLines: 3 });
    const pct = S.$('#pct'), period = S.$('#period'); fitW(period); S.fit(S.$('.dt', period), { max: 15 * u, maxLines: 1 });
    const ctab = S.$('#ctabox'); fitW(ctab); const chd = S.$('.chead', ctab); if (chd) S.fit(chd, { max: 9 * u, maxLines: 3 });
    const cards = S.$$('.card'), badges = S.$$('.badge');
    cards.forEach(c => { c.style.width = Math.min(sw * .92, (wide ? 92 : 80) * u) + 'px'; });
    const dcols = S.$$('#pct .dig .col');
    if (wide) S.$$('#pct .dig').forEach(d => d.style.fontSize = 40 * u + 'px');

    // 띠: 화면을 비스듬히 가로지름 (세이프존 밖이어도 됨)
    const bands = [
      { el: S.$('#b1'), y: tall ? sy + u * 4 : H * .09, rot: -9, sp: 90, dir: 1 },
      { el: S.$('#b2'), y: tall ? sy + sh - u * 2 : H * .91, rot: 7, sp: 70, dir: -1 },
      { el: S.$('#b3'), y: tall ? H * .82 : H * 1.2, rot: -5, sp: 60, dir: 1 },
    ];
    const tracks = bands.map(b => S.$('.track', b.el));
    const trackW = tracks.map(tk => tk.scrollWidth / 2);

    const n = items.length;
    const T1 = 2.5, T2 = 6.0, T3 = T2 + Math.max(1, n) * 2.4, T4 = T3 + 2.6, END = T4 + 3.4;
    S.setDuration(END);
    const inv = S.$('#inv');

    const root = S.$('#sale');
    S.ambient(t => {
      M.drift(root, t, .8);
      // 숫자가 꽂히는 순간 화면을 뒤집음 (강조색 ↔ 진한 색)
      const flash = t >= T1 + 1.25 && t < T1 + 1.45;
      const coverK = M.ease.inOutCubic(M.prog(t, T4 - .45, .55));
      inv.style.visibility = flash ? 'inherit' : 'hidden';
      // 띠
      bands.forEach((b, i) => {
        const k = M.spring(t - .05 - i * .12, { f: 2.2, z: .85 });
        const fast = 1 + 3 * M.ease.inQuad(M.prog(t, T4 - .6, .6));
        const x = -((t * b.sp * fast * u / 10) % trackW[i]) * b.dir;
        tracks[i].style.transform = `translateX(${(b.dir > 0 ? x : x - trackW[i]).toFixed(1)}px)`;
        tracks[i].style.opacity = (1 - M.prog(coverK, .3, .5)).toFixed(3);
        const yy = M.lerp(b.y, H / 2, coverK);
        const hh = 10 * u + coverK * Math.max(W, H) * 1.15;
        b.el.style.height = hh + 'px';
        b.el.style.top = (yy - hh / 2) + 'px';
        b.el.style.transform = `translateX(${((1 - k) * (i % 2 ? 1 : -1) * W * 1.2).toFixed(1)}px) rotate(${(b.rot * (1 - coverK)).toFixed(2)}deg)`;
        b.el.style.visibility = k > .001 ? 'inherit' : 'hidden';
        if (i !== 0) b.el.style.opacity = (1 - coverK).toFixed(3);
      });
      // 첫 문장: 크게 꽂힘
      const hkk = M.inout(t, .35, T1 - .45, { f: 3, z: .6 }, .25);
      M.place(hk, cx, cy, { s: hkk <= 1 ? 1.8 - .8 * hkk : 1 - .5 * (hkk - 1), o: hkk <= 1 ? M.clamp(hkk * 2.5) : 2 - hkk, rot: hkk <= 1 ? (1 - hkk) * -8 : 0 });
      // 할인율: 슬롯처럼 굴러 꽂힘
      const pk = M.inout(t, T1 - .1, T2 - .2, 'snappy', .3);
      M.place(pct, cx, cy, { s: pk <= 1 ? .7 + .3 * pk : 1 + .8 * (pk - 1), o: pk <= 1 ? M.clamp(pk * 3) : 2 - pk });
      dcols.forEach((col, i) => {
        const d = +pctStr[i];
        const k = M.ease.outCubic(M.prog(t, T1 + .1, 1.0 + i * .18));
        const pos = (10 + d) * k + (k >= 1 ? 0 : 0);
        col.style.transform = `translateY(${(-pos).toFixed(3)}em)`;
      });
      const offEl = S.$('#pct .off');
      if (offEl) offEl.style.transform = `rotate(-4deg) scale(${M.spring(t - (T1 + 1.3), 'pop').toFixed(4)})`;
      if (flash || (t > T1 + 1.25 && t < T1 + 1.6)) { const sk = Math.sin((t - T1 - 1.25) * 60) * u * .8 * (1 - M.prog(t, T1 + 1.25, .35)); cam.style.transform = `translate(${sk.toFixed(1)}px, ${(-sk * .6).toFixed(1)}px)`; } else cam.style.transform = '';
      // 가격표 카드: 오른쪽에서 들어와 줄이 그어지고 새 가격이 떨어짐
      cards.forEach((card, i) => {
        const t0 = T2 + i * 2.4, t1 = i === n - 1 ? T3 - .1 : t0 + 2.4;
        const k = M.inout(t, t0, t1, { f: 2.4, z: .78 }, .35);
        const x = k <= 1 ? cx + (1 - k) * W : cx - (k - 1) * W * 1.3;
        M.place(card, x, cy, { rot: k <= 1 ? (1 - k) * 12 - 2 : -2 - (k - 1) * 10, o: k > 0 && k < 1.999 ? 1 : 0 });
        const st = S.$('.strike', card); if (st) st.style.transform = `scaleX(${M.ease.outCubic(M.prog(t, t0 + .55, .35)).toFixed(4)})`;
        const nw = S.$('.new', card); const nk = M.spring(t - (t0 + .85), 'pop');
        nw.style.transform = `translateY(${((1 - nk) * -60).toFixed(1)}%)`; nw.style.opacity = M.clamp(nk * 3).toFixed(3);
        const bd = badges.find(b => +b.dataset.i === i);
        if (bd) {
          const bk = M.spring(t - (t0 + 1.2), { f: 3.6, z: .55 });
          const r = card.getBoundingClientRect ? null : null;
          M.place(bd, x + card.offsetWidth * .42, cy - card.offsetHeight * .5, { s: (1.6 - .6 * Math.min(1, bk)) * (t >= t0 + 1.2 ? 1 : 0), rot: -14 + (1 - Math.min(1, bk)) * -30, o: t >= t0 + 1.2 && k < 1.999 ? 1 : 0 });
        }
      });
      // 기간
      const dk = M.inout(t, T3, T4 - .45, 'snappy', .3);
      M.place(period, cx, cy + (dk <= 1 ? (1 - dk) * u * 12 : 0), { o: dk <= 1 ? M.clamp(dk * 2) : 2 - dk, s: dk <= 1 ? 1 : 1 + (dk - 1) * .3 });
      // 마지막: 띠가 화면을 덮고 진한 판 위에 CTA
      const ck = M.spring(t - (T4 + .15), 'snappy');
      M.place(ctab, cx, cy + (1 - ck) * u * 10, { o: t >= T4 + .15 ? M.clamp(ck * 1.6) : 0 });
      const btn = S.$('.btn', ctab);
      if (btn) btn.style.transform = t > T4 + 1.1 ? `scale(${(1 + .04 * Math.sin((t - T4) * 7)).toFixed(4)})` : '';
    });
  });
})();
</script>
