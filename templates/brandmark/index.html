<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== brandmark 템플릿: 도형으로 짜는 브랜드 =====
   스위스 그래픽처럼 12칸 격자와 기준선, 모서리 재단 표시 위에서 기하 도형(원·사각·반원·사분원·삼각)이
   선택 상자(네 모서리 흰 네모)와 베지어 핸들을 달고 나타나 모양을 바꾸며(border-radius·clip-path 모프) 한 덩어리 마크가 됨
   → 제목이 줄마다 기준선 아래에서 올라옴 → 격자 칸마다 색면 + 도형 아이콘 + 장점, 박마다 칸 색이 와이프로 갈림
   → 사분원 조각이 돌며 채워지는 큰 원 안에서 숫자 → 원·아치·사분원 마스크 사진(없으면 도형 무늬) 타일
   → 타일 네 개가 날아와 마크가 되고(로고 이미지면 이미지로 모프) 로고 락업 · 가로줄 · CTA.
   장면 사이는 12칸 기둥이 차례로 내려와 덮었다 걷힘. 색은 브랜드 변수만(스타일 색을 켜면 --pal1~3 도). */
#bm { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--on-bg);
  --c1: var(--pal1, color-mix(in srgb, var(--accent) 55%, var(--on-bg)));
  --c2: var(--pal2, color-mix(in srgb, var(--accent) 42%, var(--bg)));
  --c3: var(--pal3, var(--on-bg));
  --tint: color-mix(in srgb, var(--on-bg) 9%, var(--bg));
  --ln: color-mix(in srgb, var(--on-bg) 9%, transparent);
  --ln2: color-mix(in srgb, var(--on-bg) 24%, transparent);
  --gd: color-mix(in srgb, var(--accent) 70%, transparent);
  --mono: "Geist Mono", var(--font-body);
  --rad: var(--radius, calc(var(--u) * .5)); }
#bm .abs { position: absolute; left: 0; top: 0; }
#bm .sc { position: absolute; inset: 0; visibility: hidden; }
.lbl { font: 600 calc(var(--u) * 1.8)/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--on-bg-muted); white-space: nowrap; }

/* 바탕: 12칸 격자 · 기준선 · 재단 표시 · 색 막대 */
#grid { position: absolute; inset: 0; }
#grid .bl { position: absolute; inset: 0; }
#grid .cl { position: absolute; top: 0; height: 100%; width: 1px; background: var(--ln); transform-origin: 50% 0; }
.crop { position: absolute; background: var(--ln2); }
#cbar { display: flex; gap: 0; }
#cbar i { display: block; width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); transform-origin: 50% 100%; }

/* 도형 (모듈·아이콘·타일 공통): 모서리 반경과 다각형을 바꿔 모양이 바뀜 */
.shp { position: absolute; left: 0; top: 0; }
#mods .mod { visibility: hidden; }

/* 선택 상자 · 베지어 핸들 · 기준선 */
.sel { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
.sel .bx { position: absolute; inset: 0; border: 2px solid var(--accent); box-sizing: border-box; }
.sel b { position: absolute; width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); margin: calc(var(--u) * -.65) 0 0 calc(var(--u) * -.65);
  background: #fff; border: 2px solid var(--accent); box-sizing: border-box; }
.sel b:nth-of-type(1) { left: 0; top: 0; } .sel b:nth-of-type(2) { left: 100%; top: 0; }
.sel b:nth-of-type(3) { left: 100%; top: 100%; } .sel b:nth-of-type(4) { left: 0; top: 100%; }
.pen { position: absolute; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; }
.pen .pl { position: absolute; left: 0; top: -1px; height: 2px; background: var(--accent); }
.pen .pa { position: absolute; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); margin: calc(var(--u) * -.55) 0 0 calc(var(--u) * -.55); background: var(--accent); }
.pen .ph { position: absolute; left: 0; top: 0; width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); margin: calc(var(--u) * -.7) 0 0 calc(var(--u) * -.7);
  border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-sizing: border-box; }
.gd { position: absolute; left: 0; top: 0; background: var(--gd); visibility: hidden; }

/* 1) 훅: 꼬리표 칸 + 제목 */
#kick { width: 0; }
#kick .kr { position: absolute; left: 0; top: 0; width: 100%; height: 2px; background: var(--on-bg); transform-origin: 0 50%; }
#kick .km { position: absolute; left: 0; top: calc(var(--u) * 1.6); overflow: hidden; padding-bottom: .1em; }
#kick .ki { display: flex; align-items: center; gap: calc(var(--u) * 1.1); font: 700 calc(var(--u) * 2.5)/1.2 var(--mono); letter-spacing: .08em; color: var(--on-bg); white-space: nowrap; }
#kick .ki i { flex: none; width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); background: var(--accent); }
#kick .kn { position: absolute; right: 0; top: calc(var(--u) * 1.6); }
#ttl { font-family: var(--font-display); font-weight: var(--tw, 700); line-height: 1.1; letter-spacing: var(--tt, -.035em); color: var(--on-bg); white-space: pre-line; word-break: keep-all; }
#ttl .hl { color: var(--accent); }
.bln { position: absolute; left: 0; top: 0; height: 2px; background: var(--on-bg); transform-origin: 0 50%; }

/* 2) 장점: 격자 칸 (색면 세 벌을 겹쳐 두고 와이프로 바꿈) */
.cell { position: absolute; left: 0; top: 0; }
.cell .cc { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
.cell .cs { position: absolute; left: 0; top: 0; }
.cell .cn { position: absolute; font: 600 calc(var(--u) * 1.7)/1 var(--mono); letter-spacing: .14em; white-space: nowrap; opacity: .75; }
.cell .cn em { font-style: normal; opacity: .55; }
.cell .ct { position: absolute; left: 0; top: 0; font-family: var(--font-heading); font-weight: 700; line-height: 1.22; letter-spacing: -.02em; word-break: keep-all; white-space: pre-line; }

/* 3) 숫자: 사분원 조각이 도는 큰 원 */
#ring { position: absolute; left: 0; top: 0; overflow: visible; }
#ring .trk { fill: none; stroke: var(--ln2); stroke-width: 2; stroke-dasharray: 6 8; }
#ring .q0 { fill: var(--accent); } #ring .q1 { fill: var(--c1); } #ring .q2 { fill: var(--c2); } #ring .q3 { fill: var(--c3); }
#nin { text-align: center; color: var(--on-bg); }
#nin .npre { font: 700 calc(var(--u) * 3.4)/1.1 var(--font-heading); letter-spacing: -.01em; white-space: nowrap; }
#nin .nrow { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; }
#nin .nv { display: inline-block; text-align: right; font: 800 100px/1 "Archivo", var(--font-display); font-stretch: 88%; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
#nin .nsuf { font: 800 .34em/1 var(--font-heading); margin-left: .08em; color: var(--accent); }
#nlab { font: 700 calc(var(--u) * 5)/1.25 var(--font-heading); letter-spacing: -.02em; color: var(--on-bg); word-break: keep-all; white-space: pre-line; }
#nsrc { display: flex; gap: calc(var(--u) * 1.2); align-items: baseline; font: 500 calc(var(--u) * 2)/1.35 var(--font-body); color: var(--on-bg-muted); }
#nsrc b { flex: none; font: 600 calc(var(--u) * 1.6)/1 var(--mono); letter-spacing: .16em; color: var(--accent); }
#nsrc span { word-break: keep-all; }

/* 4) 사진·도형 무늬 타일 */
.tile { position: absolute; left: 0; top: 0; }
.tile .ly { position: absolute; inset: 0; overflow: hidden; }
.tile .pm { position: absolute; inset: 0; overflow: hidden; }
.tile .pm img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .ph0 { position: absolute; inset: calc(var(--u) * .8); border: 2px dashed var(--ln2); display: grid; place-items: center; }
.tile .ph0 span { font: 600 calc(var(--u) * 1.6)/1 var(--mono); letter-spacing: .16em; color: var(--on-bg-muted); }

/* 5) 로고 락업 + CTA */
#limg { visibility: hidden; }
#limg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#ltx { white-space: nowrap; }
#ltx .lm { overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }
#ltx .lt { display: block; font: 900 calc(var(--u) * 8)/1 var(--font-display); letter-spacing: -.01em; color: var(--on-bg); }
#ltx .ls { display: block; margin-top: calc(var(--u) * 1.4); }
#crule { height: 2px; background: var(--on-bg); transform-origin: 0 50%; }
#crule b { position: absolute; top: calc(var(--u) * -.8); width: 2px; height: calc(var(--u) * 1.6); background: var(--on-bg); }
#crule b:first-child { left: 0; } #crule b:last-child { right: 0; }
#cdiv { width: 2px; background: var(--ln2); transform-origin: 50% 0; }
#chl { font-family: var(--font-heading); font-weight: 700; line-height: 1.14; letter-spacing: -.03em; color: var(--on-bg); white-space: pre-line; word-break: keep-all; }
#cbtn { background: var(--accent); color: var(--accent-ink); border-radius: var(--rad); white-space: nowrap; }
#cbtn .bm { display: block; overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }
#cbtn span { display: block; font: 800 calc(var(--u) * 3.4)/1 var(--font-heading); letter-spacing: -.01em; }
#csub { font: 600 calc(var(--u) * 2.4)/1.2 var(--mono); letter-spacing: .06em; color: var(--on-bg); white-space: nowrap; }
#cnote { font: 500 calc(var(--u) * 1.8)/1.3 var(--font-body); color: var(--on-bg-muted); white-space: nowrap; }

/* 장면 사이 12칸 기둥 */
#cw i { position: absolute; top: 0; height: 100%; visibility: hidden; }
</style>

<div id="viewport"><div id="stage"><div id="cam"></div></div></div>

<script>/*@GSAP@*/</script>
<script>/*@DATA@*/</script>
<script>/*@ENGINE_JS@*/</script>
<script>
(function () {
  'use strict';
  const S = Studio, M = S.M, e = S.esc;
  const st = S.story();
  const cam = S.$('#cam');
  const pad2 = n => String(n).padStart(2, '0');
  const REN = !!window.__RENDER;
  const V = n => `var(--${n})`;

  /* ---- 내용 (S.story 가 빈 값을 이미 뺐음) ---- */
  const pts = st.points, num = st.number, cta = st.cta, logo = st.logo;
  const slots = st.photoSlots.map((k, i) => ({ key: k, src: S.img(k), i }));
  const phs = slots.filter(p => p.src || !REN);     // 사진 칸 (미리보기에서는 빈 자리도, 렌더에서는 실제 사진만)

  /* ---- 도형 상태: 네 모서리 반경(%) + 네 꼭짓점 다각형(%) ---- */
  const FULL = [0, 0, 100, 0, 100, 100, 0, 100];
  const SH = {
    sq: { r: [0, 0, 0, 0], p: FULL },
    ci: { r: [50, 50, 50, 50], p: FULL },
    qtl: { r: [100, 0, 0, 0], p: FULL }, qtr: { r: [0, 100, 0, 0], p: FULL },
    qbr: { r: [0, 0, 100, 0], p: FULL }, qbl: { r: [0, 0, 0, 100], p: FULL },
    lf: { r: [100, 0, 100, 0], p: FULL }, lf2: { r: [0, 100, 0, 100], p: FULL },
    ar: { r: [50, 50, 0, 0], p: FULL },
    hu: { r: [50, 50, 50, 50], p: [0, 0, 100, 0, 100, 50, 0, 50] },
    hd: { r: [50, 50, 50, 50], p: [0, 50, 100, 50, 100, 100, 0, 100] },
    tr: { r: [0, 0, 0, 0], p: [50, 0, 50, 0, 100, 100, 0, 100] },
  };
  const mixSh = (a, b, k) => ({ r: a.r.map((v, i) => v + (b.r[i] - v) * k), p: a.p.map((v, i) => v + (b.p[i] - v) * k) });
  const f2 = v => (Math.round(v * 100) / 100);
  function setSh(el, s) {
    el.style.borderRadius = s.r.map(v => f2(Math.min(100, Math.max(0, v))) + '%').join(' ');
    const p = s.p;
    el.style.clipPath = `polygon(${f2(p[0])}% ${f2(p[1])}%, ${f2(p[2])}% ${f2(p[3])}%, ${f2(p[4])}% ${f2(p[5])}%, ${f2(p[6])}% ${f2(p[7])}%)`;
  }
  const cmix = (a, b, k) => k <= .001 ? V(a) : k >= .999 ? V(b) : `color-mix(in srgb, ${V(b)} ${(k * 100).toFixed(1)}%, ${V(a)})`;

  /* ---- 브랜드 마크: 2×2 모듈. 로고 글자로 고르므로 같은 브랜드면 늘 같은 마크 ---- */
  const MARKS = [
    { s: ['qbr', 'ci', 'sq', 'qtl'], c: ['accent', 'c1', 'c3', 'c2'] },
    { s: ['ci', 'qbl', 'qtr', 'sq'], c: ['c1', 'accent', 'accent', 'c3'] },
    { s: ['qbr', 'qbl', 'qtr', 'qtl'], c: ['accent', 'c3', 'c1', 'accent'] },
    { s: ['lf2', 'ci', 'hd', 'lf2'], c: ['c3', 'accent', 'c1', 'accent'] },
  ];
  const hash = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
  const MK = MARKS[hash(logo.text || logo.sub || 'brand') % MARKS.length];
  const START = ['ci', 'tr', 'hu', 'sq'];          // 훅에서 처음 나타날 때의 모양 (마크 모양으로 모프)

  /* ---- 장점 칸 색 세 벌: 색면 / 글자 / 도형 (짝을 지켜서 밝은·어두운 브랜드 모두 읽힘) ---- */
  const SCH = [
    { f: 'accent', i: 'accent-ink', s: 'accent-ink' },
    { f: 'paper', i: 'ink', s: 'accent' },
    { f: 'tint', i: 'on-bg', s: 'c1' },
  ];
  const PT_SH = ['ci', 'qtl', 'tr', 'hu', 'sq'];
  /* ---- 무늬 타일 색 짝 [색면, 도형] ---- */
  const PAIRS = [['accent', 'accent-ink'], ['paper', 'ink'], ['tint', 'accent'], ['c1', 'bg'], ['on-bg', 'bg'], ['bg', 'c1'], ['bg', 'c3']];
  const TILE_SH = ['qtl', 'ci', 'hu', 'qbr', 'tr', 'lf', 'qtr', 'hd', 'qbl', 'lf2'];
  const PH_MASK = [['ci', 'lf', 'ci', 'lf2'], ['ar', 'ci', 'ar', 'hu'], ['qtl', 'qtr', 'qbr', 'qbl'], ['lf2', 'ci', 'lf', 'ci']];

  const nSel = 9, nPen = 3, nGd = 8;
  cam.appendChild(S.h(`<div id="bm">
    <div id="grid"><div class="bl"></div></div>
    <div id="crops"></div>
    <div id="cbar" class="abs">${['accent', 'c1', 'c2', 'c3', 'paper', 'on-bg'].map(c => `<i style="background:${V(c)}"></i>`).join('')}</div>

    <section id="s-hook" class="sc">
      ${st.kicker ? `<div id="kick" class="abs"><i class="kr"></i><div class="km"><div class="ki"><i></i><span>${e(st.kicker)}</span></div></div><span class="kn lbl"></span></div>` : ''}
      <div id="bls"></div>
      <div id="ttlw" class="abs"><div id="ttl">${e(st.title)}</div></div>
    </section>

    ${pts.length ? `<section id="s-pts" class="sc">${pts.map((p, i) => `<div class="cell">${SCH.map(c => `<div class="cc" style="background:${V(c.f)};color:${V(c.i)}"><i class="cs shp" style="background:${V(c.s)}"></i><span class="cn">${pad2(i + 1)}<em> / ${pad2(pts.length)}</em></span><div class="ct">${e(p)}</div></div>`).join('')}</div>`).join('')}</section>` : ''}

    ${num ? `<section id="s-num" class="sc">
      <svg id="ring"><circle class="trk"/><path class="q0"/><path class="q1"/><path class="q2"/><path class="q3"/></svg>
      <div id="nin" class="abs">${num.prefix ? `<div class="npre">${e(num.prefix)}</div>` : ''}<div class="nrow"><span class="nv">${S.numText(num.value, num.decimals)}</span>${num.suffix ? `<span class="nsuf">${e(num.suffix)}</span>` : ''}</div></div>
      ${num.label ? `<div id="nlabw" class="abs"><div id="nlab">${e(num.label)}</div></div>` : ''}
      ${num.source ? `<div id="nsrc" class="abs"><b>SOURCE</b><span>${e(num.source)}</span></div>` : ''}
    </section>` : ''}

    <section id="s-pho" class="sc"></section>
    <div id="phpool" style="display:none">${phs.map(p => p.src ? `<img src="${p.src}" alt="">` : '<i></i>').join('')}</div>

    <section id="s-cta" class="sc">
      ${logo.img ? `<div id="limg" class="abs"><img src="${logo.img}" alt=""></div>` : ''}
      ${logo.text || logo.sub ? `<div id="ltx" class="abs">${logo.text ? `<div class="lm"><span class="lt">${e(logo.text)}</span></div>` : ''}${logo.sub ? `<div class="lm"><span class="ls lbl">${e(logo.sub)}</span></div>` : ''}</div>` : ''}
      <i id="crule" class="abs"><b></b><b></b></i>
      ${S.is('wide') ? '<i id="cdiv" class="abs"></i>' : ''}
      ${cta.headline ? `<div id="chlw" class="abs"><div id="chl">${e(cta.headline)}</div></div>` : ''}
      ${cta.button ? `<div id="cbtn" class="abs"><span class="bm"><span>${e(cta.button)}</span></span></div>` : ''}
      ${cta.sub ? `<div id="csub" class="abs">${e(cta.sub)}</div>` : ''}
      ${st.note ? `<div id="cnote" class="abs">${e(st.note)}</div>` : ''}
    </section>

    <div id="mods">${[0, 1, 2, 3].map(j => `<i class="shp mod" style="background:${V(MK.c[j])}"></i>`).join('')}</div>
    <div id="ui2">${'<div class="sel"><i class="bx"></i><b></b><b></b><b></b><b></b></div>'.repeat(nSel)}
      ${'<div class="pen"><i class="pl"></i><i class="ph"></i><i class="ph"></i><i class="pa"></i></div>'.repeat(nPen)}
      ${'<i class="gd"></i>'.repeat(nGd)}</div>
    <div id="cw">${'<i></i>'.repeat(12)}</div>
  </div>`));

  S.start(S => {
    const W = S.W, H = S.H, u = Math.min(W, H) / 100, sf = S.safe;
    const sx = sf.left, sy = sf.top, sw = W - sf.left - sf.right, sh = H - sf.top - sf.bottom;
    const wide = S.is('wide'), tall = S.is('tall'), por = S.is('portrait'), squ = S.is('square');
    const { clamp, prog, lerp } = M, E = M.ease;
    const px = v => (Math.round(v * 10) / 10) + 'px';
    const colX = c => sx + sw * c / 12;
    // 스타일 이징 (없으면 power3.out). 도형이 들어올 때 쓰고, 옮기기·와이프는 정확한 inOut
    const EZ = (() => { try { const f = gsap.parseEase(S.ease('power3.out')); return typeof f === 'function' ? f : E.outCubic; } catch (er) { return E.outCubic; } })();
    const IO = E.inOutCubic, IOX = E.inOutExpo;
    const MORPH = { f: 2.4, z: .78 };            // 모프 스프링 (아주 조금 넘침)
    const sty = S.sty();
    const nScenes = 3 + (pts.length ? 1 : 0) + (num ? 1 : 0);
    if (S.$('#kick .kn')) S.$('#kick .kn').textContent = `01 / ${pad2(nScenes)}`;   // 브랜드 가이드 쪽수처럼
    const root = S.$('#bm');
    if (sty.weight) root.style.setProperty('--tw', sty.weight);
    if (sty.tracking != null && isFinite(+sty.tracking)) root.style.setProperty('--tt', (+sty.tracking) + 'em');

    /* ---------- 공용 소품: 선택 상자 · 베지어 핸들 · 기준선 ---------- */
    const SELS = S.$$('#ui2 .sel').map(el => ({ el, bx: S.$('.bx', el), hs: S.$$('b', el) }));
    const PENS = S.$$('#ui2 .pen').map(el => ({ el, pl: S.$('.pl', el), ph: S.$$('.ph', el), pa: S.$('.pa', el) }));
    const GDS = S.$$('#ui2 .gd');
    const used = { sel: new Set(), pen: new Set(), gd: new Set() };
    // 선택 상자: 가운데 (cx, cy), 크기 w×h, 회전 rot, k 0→1 손잡이가 생김, o 투명도
    function sel(i, cx, cy, w, h, rot, k, o = 1) {
      const s = SELS[i]; if (!s) return;
      if (k <= .001 || o <= .001) return;
      used.sel.add(i);
      s.el.style.visibility = 'inherit';
      s.el.style.width = px(w); s.el.style.height = px(h);

    function tileAt(T, t) {
      let pi = T.base, prev = T.base, kw = 1, rot = T.rot0, flip = 0;
      T.ev.forEach((ev, j) => {
        if (t < ev.t) return;
        if (ev.kind === 'col') { prev = pi; pi = (pi + 1 + (T.k % 2)) % PAIRS.length; kw = IO(prog(t, ev.t, .38)); flip = j; }
        else rot += 90 * IOX(prog(t, ev.t, .45));
      });
      return { pi, prev, kw, rot, flip };
    }

    /* ---------- 5) 로고 락업 + CTA ---------- */
    const scta = SCN.cta, Tc = scta.T;
    const limg = S.$('#limg'), ltx = S.$('#ltx'), crule = S.$('#crule'), cdiv = S.$('#cdiv'), chlw = S.$('#chlw'), chl = S.$('#chl'), cbtn = S.$('#cbtn'), csub = S.$('#csub'), cnote = S.$('#cnote');
    let mC, MkC, cmx, cmy;
    const C = {};
    // 왼쪽 위 기준으로 두고 가운데 좌표를 기억 (선택 상자용)
    const placeAt = (el, x, y) => { M.place(el, x, y, { ax: 0, ay: 0 }); el._cx = x + el.offsetWidth / 2; el._cy = y + el.offsetHeight / 2; };
    {
      const noteH = cnote ? (() => { cnote.style.maxWidth = px(sw); S.fit(cnote, { max: 1.8 * u }); return cnote.offsetHeight; })() : 0;
      const ltLt = ltx ? S.$('.lt', ltx) : null, ltLs = ltx ? S.$('.ls', ltx) : null;
      if (cbtn) { const sp2 = S.$('span span', cbtn); cbtn.style.padding = `${px(2.3 * u)} ${px(4 * u)}`; cbtn.style.maxWidth = px(wide ? sw * .5 : sw); S.fit(sp2, { max: 3.4 * u, maxLines: 1 }); }
      if (csub) { csub.style.maxWidth = px(wide ? sw * .5 : sw); S.fit(csub, { max: 2.4 * u, maxLines: 1 }); }
      if (wide) {
        const lw = colX(5) - sx - 3 * u;
        mC = Math.min(lw * .3, sh * .2); MkC = 2 * mC + gm * mC / m;
        let ltH = 0;
        if (ltx) { if (ltLt) { ltLt.style.maxWidth = px(lw); S.fit(ltLt, { max: 8.4 * u, maxLines: 1 }); } if (ltLs) { ltLs.style.maxWidth = px(lw); S.fit(ltLs, { max: 1.9 * u, maxLines: 1 }); } ltH = ltx.offsetHeight; }
        const lstack = MkC + (ltH ? 4 * u + ltH : 0);
        cmx = sx; cmy = sy + (sh - lstack) / 2;
        if (ltx) M.place(ltx, sx, cmy + MkC + 4 * u, { ax: 0, ay: 0 });
        // 오른쪽: 가로줄 · 헤드라인 · 버튼·아랫줄
        const rx = colX(6), rw = sx + sw - rx;
        let hlH = 0;
        if (chl) { chl.style.width = px(rw); S.fit(chl, { max: 8.2 * u, maxLines: 3, keepMin: .78 }); hlH = chl.offsetHeight; }
        const bH = cbtn ? cbtn.offsetHeight : 0, sbH = csub ? csub.offsetHeight : 0;
        const rowH = Math.max(bH, sbH);
        const rstack = 2 + (hlH ? 4 * u + hlH : 0) + (rowH ? 5 * u + rowH : 0);
        const ry = sy + (sh - rstack) / 2 - (noteH ? noteH / 2 : 0);
        Object.assign(crule.style, { width: px(rw) }); M.place(crule, rx, ry, { ax: 0, ay: .5 });
        if (chl) M.place(chlw, rx, ry + 4 * u, { ax: 0, ay: 0 });
        const by = ry + (hlH ? 4 * u + hlH : 0) + 5 * u;
        if (cbtn) placeAt(cbtn, rx, by + (rowH - bH) / 2);
        if (csub) M.place(csub, cbtn ? rx + cbtn.offsetWidth + 3.4 * u : rx, by + (rowH - sbH) / 2, { ax: 0, ay: 0 });
        if (cnote) M.place(cnote, rx, sy + sh, { ax: 0, ay: 1 });
        if (cdiv) { Object.assign(cdiv.style, { height: px(sh) }); M.place(cdiv, colX(5.5), sy, { ax: .5, ay: 0 }); }
        C.ry = ry; C.rx = rx; C.rw = rw;
      } else {
        mC = (tall ? 10.6 : por ? 9.6 : 8.4) * u; MkC = 2 * mC + gm * mC / m;
        const tw = sw - MkC - 4 * u;
        if (ltx) { if (ltLt) { ltLt.style.maxWidth = px(tw); S.fit(ltLt, { max: Math.min(MkC * .5, 9 * u), maxLines: 1 }); } if (ltLs) { ltLs.style.maxWidth = px(tw); S.fit(ltLs, { max: 1.9 * u, maxLines: 1 }); } }
        let hlH = 0;
        if (chl) { chl.style.width = px(sw); S.fit(chl, { max: (tall ? 8.4 : por ? 7.8 : 6.8) * u, maxLines: 3, keepMin: .78 }); hlH = chl.offsetHeight; }
        const bH = cbtn ? cbtn.offsetHeight : 0, sbH = csub ? csub.offsetHeight : 0;
        const bw = cbtn ? cbtn.offsetWidth : 0, sbw = csub ? csub.offsetWidth : 0;
        const oneRow = !cbtn || !csub || bw + 4 * u + sbw <= sw;
        const rowH = oneRow ? Math.max(bH, sbH) : bH + 2 * u + sbH;
        const hasLow = !!(chl || cbtn || csub);
        const stack = MkC + (hasLow ? 5 * u + 2 : 0) + (hlH ? 4.4 * u + hlH : 0) + (rowH ? 5 * u + rowH : 0);
        const avail = sh - (noteH ? noteH + 3 * u : 0);
        const y0 = sy + Math.max(0, (avail - stack) / 2);
        cmx = hasLow ? sx : sx + (sw - MkC - (ltx ? 4 * u + ltx.offsetWidth : 0)) / 2; cmy = y0;
        if (ltx) M.place(ltx, cmx + MkC + 4 * u, cmy + MkC / 2, { ax: 0, ay: .5 });
        let y = cmy + MkC + 5 * u;
        Object.assign(crule.style, { width: px(sw) }); M.place(crule, sx, y, { ax: 0, ay: .5 });
        C.ry = y; C.rx = sx; C.rw = sw;
        y += 2;
        if (chl) { M.place(chlw, sx, y + 4.4 * u, { ax: 0, ay: 0 }); y += 4.4 * u + hlH; }
        y += 5 * u;
        if (cbtn) placeAt(cbtn, sx, y + (oneRow ? (rowH - bH) / 2 : 0));
        if (csub) {
          if (oneRow) M.place(csub, cbtn ? sx + sw - sbw : sx, y + (rowH - sbH) / 2, { ax: 0, ay: 0 });
          else M.place(csub, sx, y + bH + 2 * u, { ax: 0, ay: 0 });
        }
        if (cnote) M.place(cnote, sx, sy + sh, { ax: 0, ay: 1 });
        if (!hasLow) crule.style.display = 'none';
      }
      if (limg) { Object.assign(limg.style, { width: px(MkC), height: px(MkC) }); M.place(limg, cmx + MkC / 2, cmy + MkC / 2, {}); }
    }
    const ctaMark = markPos(cmx, cmy, mC);
    const ctaLm = ltx ? S.$$('.lm > span', ltx) : [];
    if (chl) S.fx.enter(chl, Tc + 1.15, { def: 'mask' });

    // 사진 장면 끝: 마크 자리에서 가까운 무늬 타일 네 개가 날아가 모듈이 됨
    const TH = spp.E - .55;
    const handoff = (() => {
      const cand = TILES.filter(T => !T.photo).map(T => ({ T, d: Math.hypot(T.cx - (cmx + MkC / 2), T.cy - (cmy + MkC / 2)) })).sort((a, b) => a.d - b.d).slice(0, 4).map(o => o.T);
      cand.sort((a, b) => (a.y - b.y) || (a.x - b.x));
      return cand.map((T, j) => {
        const s = tileAt(T, TH);
        const shapeCol = PAIRS[s.pi][1];
        T.handed = true;
        return { T, rot: s.rot, col: shapeCol, st: SH[T.shape], x: T.cx, y: T.cy, s: ts, j };
      });
    })();
    while (handoff.length < 4) handoff.push({ T: null, rot: 0, col: MK.c[handoff.length], st: SH.sq, x: cmx + MkC / 2, y: cmy + MkC / 2, s: 0, j: handoff.length });

    /* ---------- 기둥 와이프 ---------- */
    const cwCols = S.$$('#cw i');
    const CW_COL = ['accent', 'c1', 'on-bg', 'accent', 'c2', 'paper', 'accent', 'c3', 'on-bg', 'c1', 'accent', 'c2'];
    cwCols.forEach((el, i) => {
      const x0 = i === 0 ? -2 : colX(i), x1 = i === 11 ? W + 2 : colX(i + 1);
      Object.assign(el.style, { left: px(x0 - .5), width: px(x1 - x0 + 1) });
    });
    const CWD = .3, CWS = .016;

    /* ---------- 매 프레임 ---------- */
    const visIn = (el, on) => { if (el) el.style.visibility = on ? 'inherit' : 'hidden'; };
    const rise = (el, t, t0, d = .5) => { const k = t < t0 ? 0 : Math.min(1, EZ(prog(t, t0, d))); M.rise(el, k <= 0 ? 0 : k); };

    S.ambient(t => {
      /* 바탕 */
      gcols.forEach((el, c) => { el.style.transform = `scaleY(${E.outCubic(prog(t, .02 + c * .025, .55)).toFixed(4)})`; });
      blEl.style.opacity = E.outCubic(prog(t, .25, .8)).toFixed(3);
      cropEls.forEach((el, i) => { el.style.opacity = clamp((t - .15 - i * .02) * 4).toFixed(3); });
      cbarIs.forEach((el, i) => { el.style.transform = `scaleY(${E.outCubic(prog(t, .4 + i * .05, .3)).toFixed(4)})`; });

      /* 장면 보이기 (기둥이 다 덮은 순간에 바뀜) */
      SC.forEach((s, i) => {
        const el = sc[s.id]; if (!el) return;
        let on;
        if (s.id === 'pho') on = t >= s.T && t < s.E + .1;
        else if (s.id === 'cta') on = t >= s.T - .1;
        else on = t >= s.T && t < SC[i + 1].T;
        el.style.visibility = on ? 'inherit' : 'hidden';
      });

      /* 1) 훅 */
      if (t < B1) {
        if (kickO) {
          kickO.kr.style.transform = `scaleX(${EZ(prog(t, .3, .45)).toFixed(4)})`;
          rise(kickO.ki, t, .45);
          kickO.kn.style.opacity = clamp((t - .6) * 4).toFixed(3);
        }
        blines.forEach((b, i) => {
          b.style.transform = `scaleX(${E.outCubic(prog(t, tIn - .15 + i * S.stg(.1), .55)).toFixed(4)})`;
          b.style.opacity = (1 - .82 * prog(t, 2.4, .6)).toFixed(3);
        });
      }

      /* 모듈 (브랜드 마크 네 조각): 훅 → 숨음 → 사진 장면 끝에서 날아와 CTA 마크 */
      mods.forEach((el, j) => {
        if (t < B1) {
          const s0 = hookStart[j], tp = .12 + j * S.stg(.16);
          if (t < tp) { el.style.visibility = 'hidden'; return; }
          const kp = M.spring(t - tp, 'pop');
          const km = clamp(M.spring(t - (1.05 + j * .07), MORPH), 0, 1.04);
          const kg = IOX(prog(t, 1.72 + j * .04, .62));
          const wob = (1 - kg) * Math.sin(t * 1.3 + j * 1.7) * .8 * u;
          const x = lerp(s0.x, hookMark[j][0], kg) + wob, y = lerp(s0.y, hookMark[j][1], kg) - wob * .6;
          const sz = lerp(s0.s, m, kg);
          const rot = lerp(s0.r + (t - tp) * (j % 2 ? 7 : -7), 0, kg);
          el.style.width = el.style.height = px(sz);
          M.place(el, x, y, { s: kp, rot });
          setSh(el, mixSh(SH[START[j]], SH[MK.s[j]], km));
          el.style.background = V(MK.c[j]);
          // 선택 상자: 도형마다, 다 모이면 마크 둘레 하나로
          const ks = M.spring(t - tp - .05, 'snappy') * (1 - prog(t, 2.2 + j * .03, .2));
          sel(j, x, y, sz * kp + 2.4 * u, sz * kp + 2.4 * u, rot, ks);
          return;
        }
        if (t < TH) { el.style.visibility = 'hidden'; return; }
        const h = handoff[j];
        const kf = IO(prog(t, TH + j * .03, .75));
        const kmo = clamp(M.spring(t - (TH + .25 + j * .03), MORPH), 0, 1.04);
        let x = lerp(h.x, ctaMark[j][0], kf), y = lerp(h.y, ctaMark[j][1], kf);
        let sz = lerp(h.s, mC, kf), sc2 = 1;
        let rot = lerp(h.rot, Math.round(h.rot / 360) * 360, kf);
        if (limg) {   // 로고 이미지가 있으면 모듈이 가운데로 빨려 들며 이미지가 됨
          const ks = E.inCubic(prog(t, Tc + 1.0 + j * .04, .42));
          x = lerp(x, cmx + MkC / 2, ks); y = lerp(y, cmy + MkC / 2, ks);
          sc2 = 1 - ks; rot += ks * 90;
        }
        if (sz * sc2 < .5) { el.style.visibility = 'hidden'; return; }
        el.style.width = el.style.height = px(sz);
        M.place(el, x, y, { s: sc2, rot });
        setSh(el, mixSh(h.st, SH[MK.s[j]], kmo));
        el.style.background = cmix(h.col, MK.c[j], E.inOutCubic(prog(t, TH + .28 + j * .03, .16)));   // 날아가는 중간에 짧게 색이 바뀜 (회색으로 섞이는 시간을 줄임)
      });
      if (t < B1) {
        // 다 모인 마크 둘레 선택 상자 + 마크 가장자리 기준선
        const tg = 1.72 + 3 * .04 + .62;
        const kG = M.spring(t - (tg - .15), 'snappy') * (1 - prog(t, 3.0, .25));
        sel(4, mx + Mk / 2, my + Mk / 2, Mk + 3 * u, Mk + 3 * u, 0, kG);
        const go = 1 - prog(t, 3.0, .4);
        [[1, my], [1, my + Mk], [0, mx], [0, mx + Mk]].forEach(([hz, at], i) => {
          const k = E.outCubic(prog(t, tg - .2 + i * .05, .5));
          if (hz) guide(i, 1, at, i % 2 ? W : 0, i % 2 ? 0 : W, k, go * .9);
          else guide(i, 0, at, i % 2 ? H : 0, i % 2 ? 0 : H, k, go * .9);
        });
        // 베지어 핸들: 원(0)의 위쪽 점, 반원(2)의 오른쪽 점에서 손잡이를 당기며 모양이 바뀜
        [[0, .85, 1.85, -90], [2, .98, 1.95, 0]].forEach(([j, ts0, te, ang], i) => {
          const s0 = hookStart[j], tp = .12 + j * S.stg(.16);
          if (t < ts0) return;
          const kp = M.spring(t - tp, 'pop');
          const km = clamp(M.spring(t - (1.05 + j * .07), MORPH), 0, 1);
          const kg = IOX(prog(t, 1.72 + j * .04, .62));
          const wob = (1 - kg) * Math.sin(t * 1.3 + j * 1.7) * .8 * u;
          const x = lerp(s0.x, hookMark[j][0], kg) + wob, y = lerp(s0.y, hookMark[j][1], kg) - wob * .6;
          const sz = lerp(s0.s, m, kg) * kp;
          const rot = lerp(s0.r + (t - tp) * (j % 2 ? 7 : -7), 0, kg);
          const a = (ang + rot) * Math.PI / 180;
          const ax = x + Math.cos(a) * sz / 2, ay = y + Math.sin(a) * sz / 2;
          const kl = E.outCubic(prog(t, ts0, .3)), kh = M.spring(t - ts0 - .12, 'snappy');
          pen(i, ax, ay, ang + 90 + rot + km * 24, sz * (1.05 - .35 * km), kl, kh, 1 - prog(t, te, .2));
        });
      }

      /* 2) 장점 칸 */
      if (sp && t >= sp.T - .05 && t < SC[SC.indexOf(sp) + 1].T) {
        cells.forEach(c => {
          // 지금 색과 바로 앞 색
          let cur = -1, prv = -1, k = 1, ei = -1;
          c.ev.forEach(([te, s], j) => { if (t >= te) { prv = cur; cur = s; ei = j; } });
          if (ei >= 0) k = IO(prog(t, c.ev[ei][0], .42));
          const dirA = (ei % 2 === 0);
          c.ccs.forEach((cc, s) => {
            if (s === cur) {
              cc.style.visibility = 'inherit'; cc.style.zIndex = 2;
              const r = ((1 - k) * 100).toFixed(2) + '%';
              cc.style.clipPath = k >= 1 ? 'none' : sp.col ? (dirA ? `inset(0 0 ${r} 0)` : `inset(${r} 0 0 0)`) : (dirA ? `inset(0 ${r} 0 0)` : `inset(0 0 0 ${r})`);
            } else if (s === prv && k < 1) { cc.style.visibility = 'inherit'; cc.style.zIndex = 1; cc.style.clipPath = 'none'; }
            else cc.style.visibility = 'hidden';
          });
          // 아이콘: 들어올 때 모프, 색이 갈릴 때마다 90도
          let rot = 0;
          c.ev.forEach(([te], j) => { if (j > 0) rot += 90 * IOX(prog(t, te, .45)); });
          const kin = c.ev.length ? clamp(M.spring(t - c.ev[0][0] - .05, MORPH), 0, 1.04) : 1;
          c.ccs.forEach(cc => {
            const cs = cc.firstElementChild;
            M.place(cs, sp.col ? 3 * u + c.ic / 2 : 3 * u + c.ic / 2, sp.col ? 3 * u + 3.4 * u + c.ic / 2 : c.h / 2, { rot, s: .4 + .6 * kin });
            setSh(cs, mixSh(SH.sq, SH[PT_SH[c.i % PT_SH.length]], kin));
          });
          // 들어오는 칸의 아이콘에 잠깐 선택 상자
          if (c.ev.length) {
            const t0 = c.ev[0][0];
            const ks = M.spring(t - (t0 + .1), 'snappy') * (1 - prog(t, t0 + .85, .2));
            if (t >= t0 + .1) sel(5, c.icx, c.icy, c.ic + 2.4 * u, c.ic + 2.4 * u, rot, ks);
          }
        });
      }

      /* 3) 숫자: 사분원 조각이 위에서부터 시계 방향으로 돌며 채워짐 */
      if (NUM && t >= sn.T - .05 && t < SC[SC.indexOf(sn) + 1].T) {
        const { R, r, ccx, ccy, D } = NUM;
        const A = NUM.amax * IO(prog(t, NUM.tN, NUM.dN));
        const gap = 1.6;
        NUM.qs.forEach((p, q) => {
          const a0 = q * 90 + gap / 2, span = clamp(A - a0, 0, 90 - gap);
          if (span <= .05) { p.setAttribute('d', ''); return; }
          const rad = d => (d - 90) * Math.PI / 180, b0 = rad(a0), b1 = rad(a0 + span);
          const P = (rr, b) => `${(rr * Math.cos(b)).toFixed(2)} ${(rr * Math.sin(b)).toFixed(2)}`;
          p.setAttribute('d', `M${P(R, b0)}A${R.toFixed(2)} ${R.toFixed(2)} 0 0 1 ${P(R, b1)}L${P(r, b1)}A${r.toFixed(2)} ${r.toFixed(2)} 0 0 0 ${P(r, b0)}Z`);
        });
        S.$('.trk', NUM.ring).style.opacity = clamp((t - sn.T - .1) * 3).toFixed(3);
        // 기준선 십자 + 원 둘레 선택 상자
        const go = 1 - prog(t, sn.T + 2.2, .4);
        guide(0, 1, ccy, 0, W, E.outCubic(prog(t, sn.T + .05, .5)), go * .8);
        guide(1, 0, ccx, 0, H, E.outCubic(prog(t, sn.T + .12, .5)), go * .8);
        sel(6, ccx, ccy, D + 2.4 * u, D + 2.4 * u, 0, M.spring(t - (sn.T + .2), 'snappy') * go);
        // 채워지는 앞끝에 베지어 핸들
        if (A > .5) {
          const b = (A - 90) * Math.PI / 180, rm = R;
          const kh = M.spring(t - NUM.tN, 'snappy');
          pen(0, ccx + Math.cos(b) * rm, ccy + Math.sin(b) * rm, A, R * .55, E.outCubic(prog(t, NUM.tN, .3)), kh, 1 - prog(t, NUM.tN + NUM.dN + .1, .25));
        }
        NUM.nin.style.opacity = clamp((t - NUM.tN + .1) * 5).toFixed(3);
        if (NUM.npre) { const k = M.spring(t - (NUM.tN + .2), 'snappy'); NUM.npre.style.transform = `translateY(${((1 - k) * 2 * u).toFixed(1)}px)`; NUM.npre.style.opacity = clamp((t - NUM.tN - .2) * 4).toFixed(3); }
        if (NUM.nsuf) NUM.nsuf.style.opacity = clamp((t - NUM.tN - .5) * 4).toFixed(3);
        if (NUM.nsrc) { const k = M.spring(t - (sn.T + 1.5), 'snappy'); NUM.nsrc.style.opacity = clamp((t - sn.T - 1.5) * 4).toFixed(3); NUM.nsrc.style.translate = `0 ${((1 - k) * 1.6 * u).toFixed(1)}px`; }
      }

      /* 4) 사진·도형 무늬 타일 */
      if (t >= spp.T - .05 && t < spp.E + .1) {
        TILES.forEach(T => {
          const te = spp.T + .1 + T.ord * S.stg(.07);
          const kin = EZ(prog(t, te, .36));
          const kout = E.inCubic(prog(t, T.handed ? TH : spp.E - .75 + (3 - T.ord) * .04, .3));
          if (t < te || kout >= 1) { T.el.style.visibility = 'hidden'; return; }
          const s = 1 - kout;
          M.place(T.el, T.x + ts / 2, T.y + ts / 2, { s });
          T.el.style.clipPath = kin >= 1 ? 'none' : `inset(0 0 ${((1 - kin) * 100).toFixed(2)}% 0)`;
          if (T.photo) {
            // 마스크가 박마다 다음 모양으로 (사진은 그대로)
            const mk = T.mask;
            let cur = SH.sq, k2 = 0, idx = 0;
            const ms = [te + .3, ...beats.filter(b => b > te + .9)];
            ms.forEach((b, j) => { if (t >= b) { idx = j; } });
            const from = idx === 0 ? SH.sq : SH[mk[(idx - 1) % mk.length]], to = SH[mk[idx % mk.length]];
            k2 = clamp(M.spring(t - ms[idx], MORPH), 0, 1.04);
            cur = t < ms[0] ? SH.sq : mixSh(from, to, k2);
            setSh(T.pm, cur);
            if (T.ph0) T.ph0.style.borderRadius = T.pm.style.borderRadius;
            if (T.img) T.img.style.transform = `scale(${(1.14 - .14 * E.outCubic(prog(t, te, 2.2))).toFixed(4)})`;
            return;
          }
          const s2 = tileAt(T, t);
          const A = PAIRS[s2.prev], B = PAIRS[s2.pi];
          const shpK = clamp(M.spring(t - te - .12, MORPH), 0, 1.04);
          const shape = mixSh(SH.sq, SH[T.shape], shpK);
          const hide = T.handed && t >= TH;
          [[T.la, T.sa, A], [T.lb, T.sb, B]].forEach(([ly, sh2, pr], li) => {
            ly.style.background = V(pr[0]); sh2.style.background = V(pr[1]);
            sh2.style.visibility = hide ? 'hidden' : 'inherit';
            sh2.style.transform = `rotate(${s2.rot.toFixed(2)}deg) scale(${(.3 + .7 * clamp(shpK)).toFixed(4)})`;
            setSh(sh2, shape);
          });
          T.la.style.visibility = s2.kw < 1 ? 'inherit' : 'hidden';
          const r = ((1 - s2.kw) * 100).toFixed(2) + '%';
          T.lb.style.clipPath = s2.kw >= 1 ? 'none' : (s2.flip % 2 ? `inset(0 ${r} 0 0)` : `inset(${r} 0 0 0)`);
        });
      }

      /* 5) 로고 락업 + CTA */
      if (t >= Tc - .6) {
        // 모이는 마크 둘레 선택 상자, 가장자리 기준선
        const kS = M.spring(t - (TH + .55), 'snappy') * (1 - prog(t, Tc + 1.5, .25));
        sel(7, cmx + MkC / 2, cmy + MkC / 2, MkC + 3 * u, MkC + 3 * u, 0, kS);
        const go = 1 - prog(t, Tc + 1.6, .4);
        guide(4, 1, cmy + MkC, 0, W, E.outCubic(prog(t, Tc + .2, .5)), go * .9);
        guide(5, 0, cmx + MkC, 0, H, E.outCubic(prog(t, Tc + .28, .5)), go * .9);
        if (limg) {
          const kc = E.outCubic(prog(t, Tc + 1.05, .6));
          limg.style.visibility = kc > 0 ? 'inherit' : 'hidden';
          limg.style.clipPath = kc >= 1 ? 'none' : `circle(${(kc * 72).toFixed(2)}% at 50% 50%)`;
          M.place(limg, cmx + MkC / 2, cmy + MkC / 2, { s: .86 + .14 * M.spring(t - (Tc + 1.05), MORPH), o: kc > 0 ? 1 : 0 });
        }
        ctaLm.forEach((el, i) => rise(el, t, Tc + .35 + i * .15, .55));
        if (crule.style.display !== 'none') {
          const kr = E.inOutCubic(prog(t, Tc + .85, .6));
          crule.style.clipPath = `inset(-${px(u)} ${((1 - kr) * 100).toFixed(2)}% -${px(u)} 0)`;
          crule.style.visibility = kr > 0 ? 'inherit' : 'hidden';
        }
        if (cdiv) cdiv.style.clipPath = `inset(0 0 ${((1 - E.inOutCubic(prog(t, Tc + .7, .7))) * 100).toFixed(2)}% 0)`;
        if (cbtn) {
          const tb = Tc + 1.95, kb = IO(prog(t, tb, .4));
          cbtn.style.visibility = kb > 0 ? 'inherit' : 'hidden';
          cbtn.style.clipPath = kb >= 1 ? 'none' : `inset(0 ${((1 - kb) * 100).toFixed(2)}% 0 0 round ${px(.6 * u)})`;
          rise(S.$('.bm > span', cbtn), t, tb + .18, .45);
          const bw = cbtn.offsetWidth, bh = cbtn.offsetHeight;
          const ksb = M.spring(t - (tb + .25), 'snappy') * (1 - prog(t, tb + 1.15, .2));
          sel(8, cbtn._cx, cbtn._cy, bw + 2 * u, bh + 2 * u, 0, ksb);
        }
        if (csub) { const t0 = Tc + 2.35, k = M.spring(t - t0, 'snappy'); csub.style.opacity = clamp((t - t0) * 4).toFixed(3); csub.style.translate = `0 ${((1 - k) * 1.6 * u).toFixed(1)}px`; }
        if (cnote) cnote.style.opacity = clamp((t - Tc - 2.7) * 3).toFixed(3);
      }

      /* 기둥 와이프 */
      cwCols.forEach((el, i) => {
        const b = BND.find(o => t >= o.B - .55 && t < o.B + .55);
        if (!b) { el.style.visibility = 'hidden'; return; }
        const ord = b.dir > 0 ? i : 11 - i;
        const cs = b.B - CWD - 11 * CWS + ord * CWS, us = b.B + .04 + ord * CWS;
        let k, org;
        if (t < us) { k = IO(prog(t, cs, CWD)); org = b.j % 2 ? '50% 100%' : '50% 0'; }
        else { k = 1 - IO(prog(t, us, CWD)); org = b.j % 2 ? '50% 0' : '50% 100%'; }
        el.style.visibility = k > .001 ? 'inherit' : 'hidden';
        el.style.transformOrigin = org;
        el.style.transform = `scaleY(${k.toFixed(4)})`;
        el.style.background = V(CW_COL[(i + b.j * 5) % CW_COL.length]);
      });

      uiReset();
    });
  });
})();
</script>
