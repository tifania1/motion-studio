<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== greeting 템플릿: 시즌 인사 =====
   계절 그림이 선으로 그려지고 → 봉투가 열려 카드가 나오고 → 펜이 지나가며 인사말이 써지고
   → 달력에 쉬는 날이 동그라미 쳐지고 → 서명으로 끝나는 조용한 영상. */
#gr { position: absolute; inset: 0; background: var(--gbg); overflow: hidden; }
#gr .grain { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(circle at 20% 15%, rgba(255,255,255,.08), transparent 45%), radial-gradient(circle at 85% 80%, rgba(0,0,0,.18), transparent 50%); }
.abs { position: absolute; left: 0; top: 0; }
#orn { overflow: visible; }
#orn .ln { fill: none; stroke: var(--gline); stroke-linecap: round; stroke-linejoin: round; }
#orn .fl { stroke: none; fill: var(--gline); }
#season { font: 900 calc(var(--u) * 5.6)/1.2 "GreetSerif", var(--font-heading); color: var(--gline); letter-spacing: .12em; white-space: nowrap; text-align: center; }
#env { width: 10px; height: 10px; perspective: 1400px; }
#env > * { position: absolute; left: 0; top: 0; }
#env .back { background: var(--genv2); border-radius: calc(var(--u) * 1.2); }
#env .pocket { background: var(--genv); border-radius: 0 0 calc(var(--u) * 1.2) calc(var(--u) * 1.2); clip-path: polygon(0 0, 50% 46%, 100% 0, 100% 100%, 0 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
#env .flap { background: var(--genv3); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: 50% 0; }
#env .seal { width: calc(var(--u) * 9); height: calc(var(--u) * 9); border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font: 900 calc(var(--u) * 4)/1 "GreetSerif", var(--font-heading); }
#card { background: #fffdf8; color: #2a2522; border-radius: calc(var(--u) * 1.4); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.3); overflow: hidden; box-sizing: border-box; }
#card .edge { position: absolute; inset: calc(var(--u) * 2.2); border: 1.5px solid rgba(42,37,34,.18); border-radius: calc(var(--u) * .8); pointer-events: none; }
#card .ttl { position: absolute; left: 0; right: 0; text-align: center; font: 900 calc(var(--u) * 8.4)/1.28 "GreetSerif", var(--font-heading); letter-spacing: -.02em; white-space: pre-line; word-break: keep-all; color: #2a2522; padding: 0 calc(var(--u) * 6); }
#card .mini { position: absolute; left: 50%; overflow: visible; }
#card .lines { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.6); }
#card .lines .l { position: relative; font: 700 calc(var(--u) * 4.6)/1.45 var(--font-body); white-space: nowrap; color: #3a332e; }
#pen { width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 calc(var(--u) * .7) rgba(0,0,0,.08); }
#cal { position: absolute; left: 0; right: 0; text-align: center; }
#cal .ct { font: 900 calc(var(--u) * 5)/1.2 "GreetSerif", var(--font-heading); letter-spacing: .02em; }
#cal .row { display: flex; justify-content: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 3.6); }
#cal .day { position: relative; width: calc(var(--u) * 13.4); padding: calc(var(--u) * 2.2) 0 calc(var(--u) * 2.4); border-radius: calc(var(--u) * 1.4); background: #f3eee4; }
#cal .day .d { font: 900 calc(var(--u) * 5)/1 "Archivo", "GreetSerif", var(--font-display); font-stretch: 85%; }
#cal .day .w { font: 700 calc(var(--u) * 2.8)/1 var(--font-body); opacity: .6; margin-top: calc(var(--u) * 1); }
#cal .day .st { font: 800 calc(var(--u) * 3)/1.1 var(--font-body); margin-top: calc(var(--u) * 1.8); white-space: nowrap; }
#cal .day.off .st { color: var(--accent); }
#cal .day:not(.off) svg { display: none; }
#cal .day svg { position: absolute; left: -5%; top: -7%; width: 110%; height: 114%; overflow: visible; }
#cal .day svg ellipse { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; }
#cal .note { font: 600 calc(var(--u) * 3.3)/1.4 var(--font-body); opacity: .7; margin-top: calc(var(--u) * 3.4); white-space: pre-line; }
#signoff { position: absolute; left: 0; right: 0; text-align: center; }
#signoff .sg { font: 900 calc(var(--u) * 5.6)/1.2 "GreetSerif", var(--font-heading); color: var(--accent); }
#signoff .lg { display: flex; justify-content: center; align-items: baseline; gap: calc(var(--u) * 1.4); margin-top: calc(var(--u) * 2); }
#signoff .lg img { height: calc(var(--u) * 7); width: auto; }
#signoff .lt { font: 900 calc(var(--u) * 4.6)/1 var(--font-display); color: #2a2522; }
#signoff .ls { font: 700 calc(var(--u) * 2)/1 var(--font-display); letter-spacing: .3em; color: #2a2522; opacity: .7; }
#signoff .hd { font: 700 calc(var(--u) * 3)/1.3 var(--font-body); opacity: .6; margin-top: calc(var(--u) * 1.4); }
</style>

<div id="viewport"><div id="stage"><div id="cam"></div></div></div>

<script>/*@GSAP@*/</script>
<script>/*@DATA@*/</script>
<script>/*@ENGINE_JS@*/</script>
<script>
(function () {
  const S = Studio, M = S.M, C = S.content, B = S.brand, e = S.esc;
  const cam = S.$('#cam');
  // 계절마다 바탕색과 선 색
  const PAL = {
    moon: { bg: '#1E2542', line: '#F4E3B5', env: '#C9573F', env2: '#A9432F', env3: '#D86A51' },
    snow: { bg: '#24384D', line: '#EAF2F8', env: '#B8463E', env2: '#93362F', env3: '#C85A50' },
    flower: { bg: '#F2D7D5', line: '#B5525B', env: '#FFFFFF', env2: '#EDE6E0', env3: '#F7F2EE' },
    leaf: { bg: '#3B2A20', line: '#F2C38B', env: '#E8DCC6', env2: '#D4C4A8', env3: '#F1E8D8' },
    sun: { bg: '#F6C453', line: '#7A3E12', env: '#FFFFFF', env2: '#EFE7DA', env3: '#FAF5EC' },
  };
  const motif = PAL[C.motif] ? C.motif : 'moon';
  const pal = Object.assign({}, PAL[motif], C.colors || {});
  const root = document.documentElement.style;
  root.setProperty('--gbg', pal.bg); root.setProperty('--gline', pal.line);
  root.setProperty('--genv', pal.env); root.setProperty('--genv2', pal.env2); root.setProperty('--genv3', pal.env3);
  // 계절 그림 (200×200 판). ln = 선으로 그림, fl = 다 그린 뒤 채움
  const ART = {
    moon: `<path class="ln fill" d="M128 34 A72 72 0 1 0 166 150 A58 58 0 1 1 128 34 Z"/>
      <path class="ln" d="M22 150 q14 -16 30 -4 q8 -14 26 -6 q16 -2 18 12 h40"/><path class="ln" d="M70 178 q12 -10 24 -2 q10 -10 24 0 h34"/>
      <path class="ln" d="M44 54 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/><path class="ln" d="M176 70 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z"/>`,
    snow: [0, 60, 120].map(a => `<g transform="rotate(${a} 100 100)"><path class="ln" d="M100 22 V178"/><path class="ln" d="M100 50 l-16 -14 M100 50 l16 -14 M100 150 l-16 14 M100 150 l16 14"/><path class="ln" d="M100 76 l-10 -9 M100 76 l10 -9 M100 124 l-10 9 M100 124 l10 9"/></g>`).join('') + '<circle class="ln" cx="100" cy="100" r="10"/>',
    flower: [0, 72, 144, 216, 288].map(a => `<ellipse class="ln fill" cx="100" cy="62" rx="20" ry="34" transform="rotate(${a} 100 100)"/>`).join('') + '<circle class="ln" cx="100" cy="100" r="14"/><path class="ln" d="M100 136 C 98 160, 108 178, 100 196"/>',
    leaf: '<path class="ln fill" d="M100 18 C 150 40, 176 92, 150 140 C 132 172, 108 178, 100 182 C 92 178, 68 172, 50 140 C 24 92, 50 40, 100 18 Z"/><path class="ln" d="M100 30 V196"/><path class="ln" d="M100 70 l-28 -16 M100 70 l28 -16 M100 104 l-36 -20 M100 104 l36 -20 M100 138 l-30 -18 M100 138 l30 -18"/>',
    sun: '<circle class="ln fill" cx="100" cy="100" r="38"/>' + Array.from({ length: 12 }, (_, i) => `<path class="ln" d="M100 ${i % 2 ? 40 : 30} V${i % 2 ? 50 : 44}" transform="rotate(${i * 30} 100 100)"/>`).join('') + '<path class="ln" d="M20 178 q20 -14 40 0 q20 14 40 0 q20 -14 40 0 q20 14 40 0"/>',
  };
  const lines = (C.lines || []).slice(0, 5);
  const sched = C.schedule || null;
  const days = sched ? (sched.days || []).slice(0, 5) : [];
  const logoImg = B.logo && S.img(B.logo);
  cam.appendChild(S.h(`<div id="gr"><div class="grain"></div>
    <svg id="orn" class="abs" viewBox="0 0 200 200">${ART[motif]}</svg>
    ${C.season ? `<div id="season" class="abs">${e(C.season)}</div>` : ''}
    <div id="env" class="abs"><div class="back"></div>
      <div id="card"><div class="edge"></div>
        <svg class="mini" viewBox="0 0 200 200">${ART[motif].replace(/class="ln/g, 'class="mln')}</svg>
        <div class="ttl">${e(C.title || '')}</div>
        <div class="lines">${lines.map(l => `<div class="l"><span>${e(l)}</span></div>`).join('')}</div>
        ${sched ? `<div id="cal"><div class="ct">${e(sched.title || '')}</div><div class="row">${days.map(d => `<div class="day ${/휴무|쉬|closed/i.test(d[2] || '') ? 'off' : ''}"><div class="d">${e(d[0] || '')}</div><div class="w">${e(d[1] || '')}</div><div class="st">${e(d[2] || '')}</div><svg viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="50" rx="47" ry="46" transform="rotate(-6 50 50)"/></svg></div>`).join('')}</div>${sched.note ? `<div class="note">${e(sched.note)}</div>` : ''}</div>` : ''}
        <div id="signoff">${C.sign ? `<div class="sg">${e(C.sign)}</div>` : ''}<div class="lg">${logoImg ? `<img src="${logoImg}" alt="">` : ''}${B.logoText ? `<span class="lt">${e(B.logoText)}</span>` : ''}${B.logoSub ? `<span class="ls">${e(B.logoSub)}</span>` : ''}</div>${(C.cta || {}).sub ? `<div class="hd">${e(C.cta.sub)}</div>` : ''}</div>
        <div id="pen" class="abs"></div>
      </div>
      <div class="pocket"></div><div class="flap"></div><div class="seal">${e((B.logoText || B.name || ' ')[0])}</div>
    </div>
  </div>`));

  S.start(S => {
    const W = S.W, H = S.H, u = Math.min(W, H) / 100, sf = S.safe;
    const sx = sf.left, sy = sf.top, sw = W - sf.left - sf.right, sh = H - sf.top - sf.bottom;
    const cx = sx + sw / 2, cy = sy + sh / 2;
    const wide = S.is('wide');
    const T1 = 3.0, T2 = 5.6, T3 = 5.6 + 1.6 * Math.max(1, lines.length) + .6, T4 = T3 + (days.length ? 3.4 : 0), END = T4 + 3.2;
    S.setDuration(END);

    // 계절 그림
    const orn = S.$('#orn'), oSize = Math.min(sw, sh) * (wide ? .5 : .56);
    orn.style.width = orn.style.height = oSize + 'px';
    const oPaths = S.$$('#orn .ln');
    oPaths.forEach(p => p.setAttribute('stroke-width', 3.2));
    const season = S.$('#season');
    // 봉투와 카드
    const env = S.$('#env');
    const cardH = wide ? sh * .94 : Math.min(sh * .96, Math.min(sw * .94, 92 * u) * 1.08), cardW = wide ? Math.min(sw * .7, cardH * 1.3) : Math.min(sw * .94, 92 * u);
    const ew = cardW * .9, eh = ew * .62;
    const back = S.$('.back', env), pocket = S.$('.pocket', env), flap = S.$('.flap', env), seal = S.$('.seal', env), card = S.$('#card');
    [back, pocket].forEach(el => { el.style.width = ew + 'px'; el.style.height = eh + 'px'; el.style.left = -ew / 2 + 'px'; el.style.top = -eh / 2 + 'px'; });
    flap.style.width = ew + 'px'; flap.style.height = eh * .56 + 'px'; flap.style.left = -ew / 2 + 'px'; flap.style.top = -eh / 2 + 'px';
    card.style.width = cardW + 'px'; card.style.height = cardH + 'px';
    // 카드 안 배치
    const mini = S.$('.mini', card), ttl = S.$('.ttl', card), lw = S.$('.lines', card), cal = S.$('#cal'), so = S.$('#signoff'), pen = S.$('#pen');
    const ms = cardH * .16; mini.style.width = mini.style.height = ms + 'px'; mini.style.top = cardH * .07 + 'px'; mini.style.marginLeft = -ms / 2 + 'px';
    S.$$('.mln', mini).forEach(p => { p.style.fill = p.classList.contains('fill') ? 'var(--accent)' : 'none'; p.style.stroke = 'var(--accent)'; p.style.strokeWidth = 4; p.style.strokeLinecap = 'round'; p.style.fillOpacity = .18; });
    ttl.style.top = cardH * .25 + 'px';
    S.fit(ttl, { max: (wide ? 7.4 : 8.4) * u, maxLines: 3 });
    lw.style.top = (cardH * .25 + ttl.offsetHeight + u * 4) + 'px';
    S.$$('.l', lw).forEach(l => S.fit(l, { max: (wide ? 4.2 : 4.6) * u }));
    if (cal) cal.style.top = cardH * .27 + 'px';
    if (cal) { const row = S.$('.row', cal); if (row.scrollWidth > cardW * .9) { const k = cardW * .9 / row.scrollWidth; row.style.transform = `scale(${k.toFixed(3)})`; row.style.transformOrigin = '50% 0'; } }
    so.style.top = (cardH - so.offsetHeight - cardH * .08) + 'px';
    const lineEls = S.$$('.l', lw), lineSpans = lineEls.map(l => S.$('span', l));
    const circles = S.$$('#cal .day.off ellipse'), dayEls = S.$$('#cal .day');

    S.ambient(t => {
      // 1) 계절 그림이 선으로 그려짐
      const ok = M.inout(t, 0, T1 - .2, 'smooth', .4);
      const oy = sy + sh * (wide ? .42 : .4);
      M.place(orn, cx, oy - (ok > 1 ? (ok - 1) * u * 18 : 0), { s: ok > 1 ? 1 - (ok - 1) * .4 : 1, o: ok > 1 ? 2 - ok : 1 });
      oPaths.forEach((p, i) => { M.draw(p, M.ease.inOutCubic(M.prog(t, .15 + i * .12, 1.3))); if (p.classList.contains('fill')) p.style.fillOpacity = (.9 * M.ease.outCubic(M.prog(t, 1.5, .8))).toFixed(3); });
      if (season) M.place(season, cx, oy + oSize * .56, { ay: 0, o: M.clamp((t - 1.4) * 2) * (ok > 1 ? 2 - ok : 1) });
      // 2) 봉투가 올라오고 날개가 열리고 카드가 빠져나와 커짐
      const ek = M.spring(t - (T1 - .5), { f: 1.6, z: .9 });
      const fl = 180 * M.ease.inOutCubic(M.prog(t, T1 + .5, .6));
      const pull = M.ease.inOutCubic(M.prog(t, T1 + 1.0, .8));
      const grow = M.spring(t - (T1 + 1.7), { f: 1.4, z: .92 });
      const envY = cy + (1 - ek) * H * .8 + M.ease.inCubic(M.prog(t, T1 + 1.7, .7)) * H * 1.7;
      M.place(env, cx, envY, { o: t > T1 - .5 ? 1 : 0 });
      flap.style.transform = `rotateX(${fl.toFixed(2)}deg)`;
      flap.style.zIndex = fl > 90 ? 0 : 3; back.style.zIndex = 0; pocket.style.zIndex = 2; seal.style.zIndex = 4; card.style.zIndex = fl > 90 ? 1 : 0;
      M.place(seal, 0, -eh / 2 + eh * .5, { s: 1, o: fl < 40 ? 1 : 0 });
      // 카드: 봉투 안 → 위로 빠짐 → 화면 가운데에서 커짐 (봉투가 내려가도 카드는 남음)
      const inEnvS = ew * .9 / cardW, inEnvSy = eh * .86 / cardH;
      const s = M.lerp(inEnvS, 1, grow), sy2 = M.lerp(inEnvSy, 1, grow) / s;
      const cardYInEnv = eh * .02 - pull * eh * .8;
      const cardCY = M.lerp(envY + cardYInEnv, cy, grow) - envY;   // env 안 좌표
      M.place(card, 0, cardCY, { s, sy: sy2, o: t > T1 ? 1 : 0, rot: (1 - grow) * -2 });
      card.style.visibility = t > T1 ? 'inherit' : 'hidden';
      // 3) 제목과 미니 그림
      M.show(mini, t > T2 - .9); S.$$('.mln', mini).forEach((p, i) => M.draw(p, M.ease.inOutCubic(M.prog(t, T2 - .9 + i * .06, .9))));
      const tk = M.inout(t, T2 - .5, days.length ? T3 - .35 : null, 'smooth', .4);
      ttl.style.opacity = (tk <= 1 ? M.clamp(tk) : 2 - tk).toFixed(3);
      ttl.style.transform = `translateY(${((tk < 1 ? (1 - tk) * 4 : -(tk - 1) * 8) * u).toFixed(1)}px)`;
      // 4) 펜이 지나가며 한 줄씩 써짐
      let penOn = false;
      lineEls.forEach((l, i) => {
        const t0 = T2 + .2 + i * 1.6, k = M.ease.inOutSine(M.prog(t, t0, 1.35));
        const out = days.length ? M.prog(t, T3 - .35, .4) : 0;
        l.style.clipPath = `inset(-20% ${((1 - k) * 100).toFixed(2)}% -20% 0)`;
        l.style.opacity = (1 - out).toFixed(3);
        l.style.visibility = k > 0 && out < 1 ? 'inherit' : 'hidden';
        if (k > 0 && k < 1) {
          penOn = true;
          const sp = lineSpans[i], x = lw.offsetLeft + l.offsetLeft + sp.offsetLeft + sp.offsetWidth * k, y = lw.offsetTop + l.offsetTop + l.offsetHeight * .82;
          M.place(pen, x, y + Math.sin(t * 40) * u * .25, { s: 1 });
        }
      });
      if (!penOn) M.show(pen, false);
      // 5) 달력: 쉬는 날에 동그라미
      if (cal) {
        const ck = M.inout(t, T3 + .4, null, 'snappy');
        cal.style.opacity = M.clamp(ck * 1.5).toFixed(3); cal.style.visibility = t > T3 + .4 ? 'inherit' : 'hidden';
        dayEls.forEach((d, i) => { const k = M.spring(t - (T3 + .6 + i * .12), 'pop'); d.style.transform = `translateY(${((1 - Math.min(1, k)) * u * 6).toFixed(1)}px) scale(${(.85 + .15 * k).toFixed(4)})`; d.style.opacity = M.clamp(k * 2).toFixed(3); });
        circles.forEach((c, i) => M.draw(c, M.ease.inOutCubic(M.prog(t, T3 + 1.5 + i * .35, .5))));
      }
      // 6) 서명
      const sk2 = M.spring(t - (T4 + .2), 'smooth');
      so.style.opacity = M.clamp(sk2 * 1.4).toFixed(3); so.style.visibility = t > T4 + .2 ? 'inherit' : 'hidden';
      so.style.transform = `translateY(${((1 - sk2) * u * 4).toFixed(1)}px)`;
      const gk = M.spring(t - (T4 + .2), 'soft');
      cam.style.transform = `scale(${(1 + .02 * gk + .012 * M.prog(t, T2, END - T2)).toFixed(4)}) translateY(${(Math.sin(t * 1.1) * u * .25).toFixed(2)}px)`;
      orn.style.opacity = orn.style.opacity;
    });
  });
})();
</script>
