<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== news 템플릿: 소식 발표 (뉴스 속보 화면 + 로고 락업) =====
   브랜드 색 띠(스트랩)가 사선으로 날아와 꼬리표·날짜·회사 이름을 보여 주고 빠져나가면 방송 화면 틀이 깔림.
   하단 자막 바에 헤드라인이 타자로 들어오고, 맨 아래 티커가 계속 흐름. 가운데 화면에는 소식 종류(type)마다 다른 소품
   (협약 × 맞물림 · 금액 굴리기 · 메달 선 그리기 · 인증 도장 · 제품 카드) → 핵심 사실 표 → 인용 → 띠가 한 번 더 쓸고 지나가며 로고 락업.
   실제 방송사 로고·이름·디자인은 쓰지 않고 브랜드 색으로 만든 일반적인 뉴스 문법만 씀. */
#nw { position: absolute; inset: 0; background: var(--bg); overflow: hidden; }
.abs { position: absolute; left: 0; top: 0; }
#nw-bgl { position: absolute; inset: -6%; }
#nw-bgl .beam { position: absolute; top: -30%; height: 160%; background: color-mix(in srgb, var(--on-bg) 4%, transparent); transform: skewX(-16deg); }
#nw-bgl .dots { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--pattern) 0 calc(var(--u) * .2), transparent calc(var(--u) * .24)); background-size: calc(var(--u) * 3) calc(var(--u) * 3); }

/* 로고 락업 (--ls: 글자 크기, u 단위) */
.lock { display: flex; align-items: center; gap: calc(var(--u) * var(--ls) * .42); color: var(--on-bg); --ls: 3.2; white-space: nowrap; }
.lock img { height: calc(var(--u) * var(--ls) * 1.5); width: auto; }
.lock .lw { display: flex; flex-direction: column; align-items: flex-start; }
.lock b { font: 900 calc(var(--u) * var(--ls))/1 var(--font-display); letter-spacing: .01em; }
.lock small { font: 700 calc(var(--u) * var(--ls) * .38)/1 var(--font-display); letter-spacing: .3em; color: var(--on-bg-muted); margin-top: calc(var(--u) * var(--ls) * .24); }
.lock.center .lw { align-items: center; }

/* 위 줄: 회사 버그(로고) · 날짜 상자 */
#nw-date { display: flex; align-items: stretch; font: 800 calc(var(--u) * 2.5)/1 "Archivo", var(--font-body); font-stretch: 100%; color: var(--on-bg); white-space: nowrap; }
#nw-date i { width: calc(var(--u) * 1); background: var(--accent); }
#nw-date span { padding: calc(var(--u) * 1.1) calc(var(--u) * 1.5); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--on-bg) 28%, transparent); letter-spacing: .06em; }

/* 가운데 화면(패널) */
#nw-panel .pbg { position: absolute; inset: 0; border-radius: calc(var(--u) * 1.4); background: color-mix(in srgb, var(--on-bg) 6%, var(--bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-bg) 14%, transparent); }
#nw-panel .ptab { position: absolute; left: calc(var(--u) * 2.4); top: 0; display: flex; align-items: center; gap: calc(var(--u) * 1.1); background: var(--on-bg); color: var(--bg); font: 900 calc(var(--u) * 2.3)/1 var(--font-body); padding: calc(var(--u) * 1) calc(var(--u) * 1.6); white-space: nowrap; transform: translateY(-50%); z-index: 3; }
#nw-panel .ptab i { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); background: var(--accent); }
#nw-panel .pin { position: absolute; overflow: hidden; }
#nw-panel .pnote { position: absolute; right: calc(var(--u) * 2); bottom: calc(var(--u) * .7); font: 600 calc(var(--u) * 1.6)/1.2 var(--font-body); color: var(--on-bg-muted); white-space: nowrap; }
.psc { position: absolute; left: 0; top: 0; }
.pwipe { position: absolute; top: 0; bottom: 0; left: 0; z-index: 4; pointer-events: none; }
.pwipe i { position: absolute; top: 0; bottom: 0; }
.pwipe .w1 { width: calc(var(--u) * 2.2); background: var(--accent); }
.pwipe .w2 { width: calc(var(--u) * .6); background: var(--on-bg); }

/* 하단 자막 바 */
.l3 { white-space: nowrap; box-sizing: border-box; }
#nw-badge { background: var(--accent); color: var(--accent-ink); font: 900 calc(var(--u) * 3)/1 var(--font-heading); display: flex; align-items: center; letter-spacing: .02em; }
#nw-hbar { background: var(--paper); color: var(--ink); }
#nw-hl { font: 900 calc(var(--u) * 5)/1.24 var(--font-heading); letter-spacing: -.025em; white-space: pre-line; word-break: keep-all; }
#nw-caret { position: absolute; left: 0; top: 0; width: calc(var(--u) * .5); background: var(--accent); }
#nw-sbar { background: color-mix(in srgb, var(--on-bg) 11%, var(--bg)); color: var(--on-bg); font: 700 calc(var(--u) * 2.8)/1.3 var(--font-body); overflow: hidden; }

/* 티커 */
#nw-tk { background: var(--on-bg); color: var(--bg); overflow: hidden; }
#nw-tk .tkh { position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center; background: var(--accent); color: var(--accent-ink); font: 900 calc(var(--u) * 2.6)/1 var(--font-display); letter-spacing: .04em; white-space: nowrap; box-sizing: border-box; z-index: 2; }
#nw-tk .tkc { position: absolute; top: 0; bottom: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 calc(var(--u) * 2.4), #000 calc(100% - var(--u) * 3.6), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 calc(var(--u) * 2.4), #000 calc(100% - var(--u) * 3.6), transparent 100%); }
#nw-tk .tkr { position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; font: 800 calc(var(--u) * 2.7)/1 var(--font-body); }
#nw-tk .tkr i { display: inline-block; flex: none; width: calc(var(--u) * 1); height: calc(var(--u) * 1); background: var(--accent); margin: 0 calc(var(--u) * 2.6); transform: rotate(45deg); }

/* 범퍼 띠(스트랩) */
.strap { position: absolute; left: 0; top: 0; z-index: 30; }
.strap .sk { position: relative; transform: skewX(-16deg); transform-origin: 0 50%; overflow: hidden; }
.strap .ct { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: calc(var(--u) * 2); transform: skewX(16deg); white-space: nowrap; }
.strap.s-a .sk { background: var(--accent); }
.strap.s-k .sk { background: var(--accent); color: var(--accent-ink); }
.strap.s-k .ct { font: 900 calc(var(--u) * 13)/1 "Archivo", var(--font-display); font-stretch: 78%; letter-spacing: -.01em; }
.strap.s-p .sk { background: var(--paper); color: var(--ink); }
.strap.s-p .ct { font: 900 calc(var(--u) * 3.4)/1 var(--font-heading); }
.strap.s-p .ct em { font-style: normal; background: var(--accent); color: var(--accent-ink); padding: calc(var(--u) * .9) calc(var(--u) * 1.4); }
.strap.s-p .ct b { font: 800 calc(var(--u) * 3.4)/1 "Archivo", var(--font-body); letter-spacing: .08em; }
.strap.s-c .sk { background: color-mix(in srgb, var(--on-bg) 14%, var(--bg)); color: var(--on-bg); }
.strap.s-c .ct { font: 900 calc(var(--u) * 3)/1 var(--font-display); letter-spacing: .12em; }
.strap.s-b .sk { background: var(--on-bg); }

/* 소품: mou */
.mou-x svg { width: 100%; height: 100%; overflow: visible; }
.mou-x path { fill: none; stroke: var(--accent); stroke-linecap: square; }
.side { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.6); text-align: center; }
.plate { background: #fff; border-radius: calc(var(--u) * 1.2); display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1px color-mix(in srgb, var(--on-bg) 14%, transparent); }
.plate img { max-width: 86%; max-height: 80%; width: auto; height: auto; object-fit: contain; }
.pname { font: 900 calc(var(--u) * 6)/1.15 var(--font-heading); color: var(--on-bg); letter-spacing: -.03em; white-space: pre-line; word-break: keep-all; }
.rule { height: calc(var(--u) * .5); background: var(--accent); }
.cap { font: 900 calc(var(--u) * 4.4)/1.22 var(--font-heading); color: var(--on-bg); letter-spacing: -.025em; text-align: center; white-space: pre-line; word-break: keep-all; }
.capby { font: 700 calc(var(--u) * 2.8)/1.3 var(--font-body); color: var(--on-bg-muted); text-align: center; white-space: nowrap; }

/* 소품: invest */
.inv-num { display: flex; align-items: baseline; color: var(--on-bg); white-space: nowrap; }
.odo { display: inline-flex; font: 900 1em/1 "Archivo", var(--font-display); font-stretch: 82%; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.odo .d { display: inline-block; height: 1em; overflow: hidden; }
.odo .d .col { display: flex; flex-direction: column; }
.odo .d .col i { font-style: normal; height: 1em; display: block; text-align: center; }
.odo .s { display: inline-block; }
.inv-un { font: 900 .3em/1 var(--font-heading); color: var(--accent); margin-left: .25em; letter-spacing: -.02em; }
.brk { width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-color: var(--accent); border-style: solid; border-width: 0; box-sizing: border-box; }
.pill { background: var(--accent); color: var(--accent-ink); font: 900 calc(var(--u) * 3.6)/1 var(--font-heading); padding: calc(var(--u) * 1.4) calc(var(--u) * 2.6); border-radius: 999px; white-space: nowrap; }

/* 소품: award */
.medal svg { width: 100%; height: 100%; overflow: visible; }
.medal .ln { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
.medal .fillc { fill: color-mix(in srgb, var(--accent) 14%, color-mix(in srgb, var(--on-bg) 6%, var(--bg))); }
.medal .star { fill: var(--accent); }
.medal text { fill: var(--accent); font: 800 13px "Archivo", var(--font-body); letter-spacing: .12em; }
.atext { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
.atext .cap, .atext .capby { text-align: inherit; }

/* 소품: cert */
.doc { background: var(--paper); color: var(--ink); border-radius: calc(var(--u) * .8); box-shadow: 0 calc(var(--u) * 1.2) calc(var(--u) * 3) rgba(0,0,0,.18); box-sizing: border-box; padding: calc(var(--u) * 4) calc(var(--u) * 4.4); display: flex; flex-direction: column; align-items: flex-start; }
.doc::before { content: ""; position: absolute; inset: calc(var(--u) * 1.2); border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); border-radius: calc(var(--u) * .4); pointer-events: none; }
.doc .dh { font: 800 calc(var(--u) * 2)/1 "Archivo", var(--font-body); font-stretch: 125%; letter-spacing: .4em; opacity: .7; }
.doc .dn { font: 900 calc(var(--u) * 5)/1.2 var(--font-heading); letter-spacing: -.03em; margin-top: calc(var(--u) * 2.4); white-space: pre-line; word-break: keep-all; }
.doc .db { font: 700 calc(var(--u) * 2.6)/1.3 var(--font-body); opacity: .75; margin-top: calc(var(--u) * 1.4); }
.doc .dl { margin-top: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); width: 46%; }
.doc .dl i { height: calc(var(--u) * .5); background: color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 99px; }
.doc .dl i + i { width: 66%; }
.seal svg { width: 100%; height: 100%; overflow: visible; }
.seal .ros { fill: color-mix(in srgb, var(--accent) 16%, var(--paper)); stroke: var(--accent); stroke-width: 2.5; }
.seal .rg { fill: none; stroke: var(--accent); }
.seal .ck { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.seal text { fill: var(--accent); font: 800 13px "Archivo", var(--font-body); }

/* 소품: launch */
.lc-wrap { perspective: 1400px; }
.lcard { position: relative; background: var(--paper); color: var(--ink); border-radius: calc(var(--u) * 2); overflow: hidden; display: flex; box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0,0,0,.22); transform-origin: 50% 100%; }
.lcard.col { flex-direction: column; }
.lcard .cimg { flex: none; overflow: hidden; background: color-mix(in srgb, var(--ink) 10%, var(--paper)); }
.lcard .cimg img { width: 100%; height: 100%; object-fit: cover; }
.lcard .ctx { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * 3.6); box-sizing: border-box; }
.lcard .cn { font: 900 calc(var(--u) * 6.4)/1.12 var(--font-heading); letter-spacing: -.035em; white-space: pre-line; word-break: keep-all; }
.lcard .cs { font: 700 calc(var(--u) * 3)/1.35 var(--font-body); opacity: .78; white-space: pre-line; word-break: keep-all; }
.lcard.np { background: var(--accent); color: var(--accent-ink); }
.lcard.np .ctx { align-items: center; text-align: center; }
.newtag { font: 900 calc(var(--u) * 3.6)/1 "Archivo", var(--font-display); font-stretch: 112%; letter-spacing: .14em; padding: calc(var(--u) * 1.4) calc(var(--u) * 2) calc(var(--u) * 1.4) calc(var(--u) * 2.3); background: var(--accent); color: var(--accent-ink); border-radius: calc(var(--u) * .6); white-space: nowrap; z-index: 2; }
.newtag.inv { background: var(--on-bg); color: var(--bg); }

/* 핵심 사실 표 */
.facts { --k: 1; }
.fr { position: relative; display: flex; align-items: baseline; gap: calc(var(--u) * 3 * var(--k)); padding: calc(var(--u) * 1.9 * var(--k)) 0; }
.fr .fk { flex: none; font: 900 calc(var(--u) * 3 * var(--k))/1.3 var(--font-body); color: var(--accent); letter-spacing: .04em; white-space: nowrap; }
.fr .fv { flex: 1; min-width: 0; font: 900 calc(var(--u) * 4.4 * var(--k))/1.28 var(--font-heading); color: var(--on-bg); letter-spacing: -.02em; white-space: pre-line; word-break: keep-all; }
.fr .fl { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: color-mix(in srgb, var(--on-bg) 18%, transparent); transform-origin: 0 50%; }
.fr:first-child::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * .5); background: var(--on-bg); transform-origin: 0 50%; transform: scaleX(var(--top, 1)); }

/* 인용 */
.qm { font: 900 calc(var(--u) * 22)/.7 "Archivo", var(--font-display); color: var(--accent); height: .5em; }
.qt { font: 900 calc(var(--u) * 5.4)/1.3 var(--font-heading); color: var(--on-bg); letter-spacing: -.03em; white-space: pre-line; word-break: keep-all; }
.qt .wd { white-space: pre; }
.qb { display: flex; align-items: center; gap: calc(var(--u) * 1.6); font: 700 calc(var(--u) * 2.9)/1.3 var(--font-body); color: var(--on-bg-muted); white-space: nowrap; }
.qb i { width: calc(var(--u) * 5); height: 2px; background: var(--accent); flex: none; }

/* 마무리 락업 */
#nw-out { display: flex; flex-direction: column; align-items: center; text-align: center; }
#nw-out .rule { width: calc(var(--u) * 14); margin: calc(var(--u) * 3.6) 0 calc(var(--u) * 3); }
#nw-out .plan { font: 900 calc(var(--u) * 5.4)/1.25 var(--font-heading); color: var(--on-bg); letter-spacing: -.03em; white-space: pre-line; word-break: keep-all; }
#nw-out .hd { font: 700 calc(var(--u) * 3)/1.3 var(--font-body); color: var(--on-bg-muted); margin-top: calc(var(--u) * 2.2); white-space: nowrap; }
#nw-onote { font: 600 calc(var(--u) * 1.8)/1.2 var(--font-body); color: var(--on-bg-muted); white-space: nowrap; }
</style>

<script>/*@GSAP@*/</script>
<script>/*@DATA@*/</script>
<script>/*@ENGINE_JS@*/</script>
<script>
(function () {
  const S = Studio, M = S.M, C = S.content, B = S.brand, e = S.esc;
  const cam = S.$('#cam');
  const str = v => (v == null ? '' : String(v)).trim();
  const TYPES = { mou: '업무협약', invest: '투자 유치', award: '수상', cert: '인증 획득', launch: '신규 출시' };
  const partner = C.partner || {}, amount = C.amount || {}, award = C.award || {}, launch = C.launch || {}, quote = C.quote || {}, cta = C.cta || {};
  // 소식 종류: 정해져 있지 않으면 채워진 칸으로 짐작
  let type = str(C.type).toLowerCase();
  if (!TYPES[type]) type = str(amount.value) ? 'invest' : (str(partner.name) || S.img(partner.photo)) ? 'mou' : str(launch.name) ? 'launch' : str(award.name) ? 'award' : 'launch';
  const company = str(B.logoText) || str(B.name);
  const logoImg = B.logo && S.img(B.logo);
  const lockup = (ls, cls = '') => `<div class="lock ${cls}" style="--ls:${ls}">${logoImg ? `<img src="${logoImg}" alt="">` : ''}${(B.logoText || B.logoSub || !logoImg) ? `<div class="lw">${(B.logoText || !logoImg) ? `<b>${e(B.logoText || B.name || '')}</b>` : ''}${B.logoSub ? `<small>${e(B.logoSub)}</small>` : ''}</div>` : ''}</div>`;
  // badge: 칸이 없으면 '소식', 일부러 비워 두면 딱지 없이
  const kind = str(C.kind) || 'NEWS', badge = C.badge === undefined ? '소식' : str(C.badge), date = str(C.date);
  const topic = str(C.topic) || TYPES[type];
  const facts = (C.facts || []).filter(r => Array.isArray(r) && (str(r[0]) || str(r[1]))).slice(0, 4);
  const qText = str(quote.text), hasQuote = !!qText;
  let ticker = (C.ticker || []).map(str).filter(Boolean).slice(0, 6);
  if (!ticker.length) ticker = [str(C.headline).replace(/\s*\n\s*/g, ' '), str(C.sub), str(C.plan)].filter(Boolean);
  const yearM = date.match(/(19|20)\d\d/);

  // ---- 소품 HTML ----
  let propHtml = '';
  if (type === 'mou') {
    const pPhoto = S.img(partner.photo);
    propHtml = `<div class="side abs" id="mou-us">${lockup(6.4, 'center')}</div>
      <div class="mou-x abs" id="mou-x"><svg viewBox="0 0 100 100"><path d="M18 18 L82 82"/><path d="M82 18 L18 82"/></svg></div>
      <div class="side abs" id="mou-them">${pPhoto ? `<div class="plate"><img src="${pPhoto}" alt=""></div>` : ''}${str(partner.name) ? `<div class="pname">${e(partner.name)}</div>` : ''}</div>
      <i class="rule abs" id="p-rule"></i>
      ${str(partner.deal) ? `<div class="cap abs" id="p-cap">${e(partner.deal)}</div>` : ''}`;
  } else if (type === 'invest') {
    const v = str(amount.value);
    const odo = [...v].map(ch => /\d/.test(ch) ? `<span class="d"><span class="col">${Array.from({ length: 30 }, (_, k) => `<i>${k % 10}</i>`).join('')}</span></span>` : `<span class="s">${e(ch)}</span>`).join('');
    propHtml = `<div class="inv-num abs" id="inv-num"><span class="odo">${odo}</span>${str(amount.unit) ? `<span class="inv-un">${e(amount.unit)}</span>` : ''}</div>
      ${[0, 1, 2, 3].map(i => `<i class="brk abs" data-i="${i}"></i>`).join('')}
      ${str(amount.round) ? `<div class="pill abs" id="inv-round">${e(amount.round)}</div>` : ''}
      ${str(amount.by) ? `<div class="capby abs" id="p-by">${e(amount.by)}</div>` : ''}`;
  } else if (type === 'award') {
    propHtml = `<div class="medal abs" id="medal"><svg viewBox="0 0 200 250">
        <path class="ln rib" d="M84 146 L62 236 L74 227 L86 240 L106 156"/><path class="ln rib" d="M116 146 L138 236 L126 227 L114 240 L94 156"/>
        <circle class="fillc" cx="100" cy="92" r="68"/>
        <circle class="ln oc" cx="100" cy="92" r="68" stroke-width="5"/><circle class="ln ic" cx="100" cy="92" r="54" stroke-width="2"/>
        <path class="star" d="${(() => { let d = ''; for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 11 : 26; d += (k ? 'L' : 'M') + (100 + r * Math.cos(a)).toFixed(2) + ' ' + (88 + r * Math.sin(a)).toFixed(2); } return d + 'Z'; })()}"/>
        ${yearM ? `<text x="100" y="132" text-anchor="middle">${e(yearM[0])}</text>` : ''}
      </svg></div>
      <div class="atext abs" id="atext">${str(award.name) ? `<div class="cap">${e(award.name)}</div>` : ''}${str(award.by) ? `<div class="capby">${e(award.by)}</div>` : ''}</div>`;
  } else if (type === 'cert') {
    // 둘레 톱니(로제트) 모양
    let ros = '';
    for (let k = 0; k < 72; k++) { const a = k * Math.PI / 36, r = k % 2 ? 92 : 98; ros += (k ? 'L' : 'M') + (100 + r * Math.cos(a)).toFixed(2) + ' ' + (100 + r * Math.sin(a)).toFixed(2); }

      M.place(out, cx, cy - (onote ? 1.5 * u : 0), { o: t >= T_L ? 1 : 0, s: 1 + .045 * M.ease.inOutSine(M.prog(t, T_L, END - T_L)) });
      outLock.style.opacity = M.clamp(lk * 1.8).toFixed(3);
      outLock.style.transform = `scale(${(.86 + .14 * lk).toFixed(4)})`;
      outRule.style.transform = `scaleX(${M.ease.inOutCubic(M.prog(t, T_L + .3, .5)).toFixed(4)})`;
      if (outPlan) { const k3 = M.spring(t - (T_L + .5), 'snappy'); outPlan.style.opacity = M.clamp(k3 * 1.6).toFixed(3); outPlan.style.transform = `translateY(${((1 - k3) * 3 * u).toFixed(2)}px)`; }
      if (outHd) { const k4 = M.spring(t - (T_L + .8), 'snappy'); outHd.style.opacity = M.clamp(k4 * 1.6).toFixed(3); }
      if (onote) M.place(onote, cx, sy + sh - 1 * u, { ay: 1, o: t >= T_L + 1 ? M.clamp((t - T_L - 1) * 3) : 0 });
    });
  });
})();
</script>
