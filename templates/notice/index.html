<title>/*@TITLE@*/</title>
<style>
/*@FONTFACES@*/
/*@BRAND_CSS@*/
/*@ENGINE_CSS@*/

/* ===== notice 템플릿: 공지 (스플릿 플랩 안내판) =====
   공항 출발 안내판처럼 글자판이 차르륵 넘어가며 제목과 공지 줄이 맞춰지고, 마지막엔 가게 이름으로 다시 넘어감. */
#nt { position: absolute; inset: 0; background: #0E0E10; overflow: hidden; }
#nt .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.06), transparent 60%); }
.abs { position: absolute; left: 0; top: 0; }
#board { position: absolute; }
.lbl { font: 900 calc(var(--u) * 2.8)/1 "Archivo", var(--font-display); font-stretch: 125%; letter-spacing: .3em; color: var(--accent); white-space: nowrap; }
.rule { height: 2px; background: rgba(255,255,255,.12); }
.trow { position: absolute; left: 0; display: flex; }
.tile { position: relative; flex: none; border-radius: 6%; background: #1E1E21; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); perspective: 400px; }
.tile .hf { position: absolute; left: 0; right: 0; overflow: hidden; backface-visibility: hidden; }
.tile .hf.t { top: 0; height: 50%; border-radius: 6% 6% 0 0; background: linear-gradient(#26262A, #222225); transform-origin: 50% 100%; }
.tile .hf.b { bottom: 0; height: 50%; border-radius: 0 0 6% 6%; background: linear-gradient(#1D1D20, #1A1A1C); transform-origin: 50% 0; }
.tile .hf span { position: absolute; left: 0; right: 0; height: 200%; display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 900; color: #F2F0EA; }
.tile .hf.t span { top: 0; }
.tile .hf.b span { top: -100%; }
.tile .seam { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #070708; z-index: 5; }
.tile.amber .hf span { color: var(--accent); }
.tile.num .hf span { font-family: "Archivo", var(--font-heading); font-stretch: 85%; }
#nt .sheen { position: absolute; top: -20%; height: 140%; width: 70%; left: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.035) 35%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.035) 65%, transparent 100%); }
.live { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); border-radius: 50%; background: var(--accent); box-shadow: 0 0 calc(var(--u) * 1.6) var(--accent); }
.foot { font: 700 calc(var(--u) * 3)/1.3 var(--font-body); color: rgba(255,255,255,.55); white-space: nowrap; }
</style>

<div id="viewport"><div id="stage"><div id="cam"></div></div></div>

<script>/*@GSAP@*/</script>
<script>/*@DATA@*/</script>
<script>/*@ENGINE_JS@*/</script>
<script>
(function () {
  const S = Studio, M = S.M, C = S.content, B = S.brand, e = S.esc;
  const cam = S.$('#cam');
  const rows = (C.rows || []).slice(0, 5);
  const end = C.end || [B.logoText || B.name || '', (C.cta || {}).sub || ''];
  cam.appendChild(S.h(`<div id="nt"><div class="vig"></div><div id="board">
    <div class="lbl abs" id="lbl">${e(C.label || 'NOTICE')}</div><div class="live abs" id="live"></div><div class="rule abs" id="rule1"></div><div class="rule abs" id="rule2"></div>
    <div class="foot abs" id="foot">${e(C.footer || '')}</div>
  </div><div class="sheen" id="sheen"></div></div>`));

  S.start(S => {
    const W = S.W, H = S.H, u = Math.min(W, H) / 100, sf = S.safe;
    const sx = sf.left, sy = sf.top, sw = W - sf.left - sf.right, sh = H - sf.top - sf.bottom;
    const board = S.$('#board');
    const BW = sw * .98, BX = sx + (sw - BW) / 2;
    // 줄 구성: 제목(큰 판) / 공지 줄(날짜 | 내용) / 메모
    const pad = (s, n) => { s = [...String(s || '')]; while (s.length < n) s.push(' '); return s.slice(0, n); };
    const padC = (s, n) => { s = [...String(s || '')].slice(0, n); const l = Math.floor((n - s.length) / 2); return pad(' '.repeat(l) + s.join(''), n); };
    const dateN = Math.max(1, ...rows.map(r => [...String(r[0] || '')].length));
    const textN = Math.max(1, ...rows.map(r => [...String(r[1] || '')].length));
    const rowN = dateN + 1 + textN;
    const titleN = Math.max([...String(C.title || '')].length, [...String(end[0] || '')].length, 1);
    const noteN = Math.max([...String(C.note || '')].length, [...String(end[1] || '')].length, 0);
    const gapR = .08;   // 칸 사이 간격 (칸 너비 대비)
    const fitW = (n, maxW) => maxW / (n + (n - 1) * gapR);
    const stack = !S.is('wide') && rowN > 12;
    const tTitle = Math.min(fitW(titleN, BW), 15 * u), tRow = Math.min(fitW(stack ? Math.max(dateN, textN) : rowN, BW), stack ? 10 * u : 8.4 * u), tNote = Math.min(fitW(Math.max(1, noteN), BW), 5.2 * u);
    const lines = [];
    const glyphPool = [...new Set([...(C.title || '') + rows.map(r => r.join('')).join('') + (C.note || '') + end.join('')].filter(c => c.trim()))];
    function addLine(chars, size, opts = {}) { lines.push({ chars, size, ...opts }); }
    addLine(padC(C.title, titleN), tTitle, { kind: 'title', end: padC(end[0], titleN) });
    rows.forEach((r, i) => {
      if (stack) { addLine(pad(r[0], dateN), tRow, { kind: 'row', amberN: dateN, first: true }); addLine(pad(r[1], textN), tRow, { kind: 'row', amberN: 0 }); }
      else addLine(pad(r[0], dateN).concat([' '], pad(r[1], textN)), tRow, { kind: 'row', amberN: dateN });
    });
    if (noteN) addLine(padC(C.note, noteN), tNote, { kind: 'note', end: padC(end[1], noteN) });
    // 높이 계산 후 세로 가운데
    const hOf = l => l.size * 1.28;
    const lineGap = [3.2 * u, 1.6 * u, 3.2 * u];
    const gapOf = (l, i) => !i ? 0 : l.kind === 'row' && lines[i - 1].kind === 'row' ? (stack && l.first ? lineGap[0] * .8 : lineGap[1]) : lineGap[0];
    let total = 0; lines.forEach((l, i) => { total += hOf(l) + gapOf(l, i); });
    const head = 7 * u, footH = C.footer ? 6 * u : 0;
    // 세로로 넘치면 칸 크기를 줄임
    const room = sh * .98 - head - footH;
    if (total > room) { const k = room / total; lines.forEach(l => l.size *= k); lineGap.forEach((g, i) => lineGap[i] = g * k); total = 0; lines.forEach((l, i) => { total += hOf(l) + gapOf(l, i); }); }
    const BH = head + total + footH;
    const BY = sy + (sh - BH) / 2;
    board.style.left = BX + 'px'; board.style.top = BY + 'px'; board.style.width = BW + 'px'; board.style.height = BH + 'px';
    S.$('#lbl').style.top = '0px';
    const live = S.$('#live'); live.style.left = (BW - 1.6 * u) + 'px'; live.style.top = (.6 * u) + 'px';
    const sheen = S.$('#sheen');
    const r1 = S.$('#rule1'); r1.style.top = head - 2.6 * u + 'px'; r1.style.width = BW + 'px';
    const r2 = S.$('#rule2'); r2.style.top = (head + total + 2 * u) + 'px'; r2.style.width = BW + 'px';
    const foot = S.$('#foot'); foot.style.top = (head + total + 3.4 * u) + 'px';
    // 칸 만들기
    const tiles = [];
    let y = head;
    lines.forEach((l, li) => {
      y += gapOf(l, li);
      const row = S.h('<div class="trow"></div>'); board.appendChild(row);
      const tw = l.size, th = hOf(l), gap = tw * gapR;
      const rowW = l.chars.length * tw + (l.chars.length - 1) * gap;
      row.style.top = y + 'px'; row.style.left = (l.kind === 'title' ? (BW - rowW) / 2 : l.kind === 'note' ? (BW - rowW) / 2 : 0) + 'px'; row.style.gap = gap + 'px';
      l.chars.forEach((c, ci) => {
        const isAmber = l.kind === 'row' && ci < l.amberN || l.kind === 'title';
        const el = S.h(`<div class="tile ${isAmber ? 'amber' : ''} ${/[0-9.:\-]/.test(c) ? 'num' : ''}"><div class="hf t"><span></span></div><div class="hf b"><span></span></div><div class="hf t fl1"><span></span></div><div class="hf b fl2"><span></span></div><i class="seam"></i></div>`);
        el.style.width = tw + 'px'; el.style.height = th + 'px';
        S.$$('span', el).forEach(sp => sp.style.fontSize = (tw * .8) + 'px');
        row.appendChild(el);
        tiles.push({ el, line: li, idx: ci, final: c, end: l.end ? l.end[ci] : null, kind: l.kind, sp: S.$$('span', el), fl1: S.$('.fl1', el), fl2: S.$('.fl2', el) });
      });
      y += th;
    });
    // 시간표
    let ri = -1; const lineStart = lines.map((l, i) => { if (l.kind === 'row' && (!stack || l.first)) ri++; return i === 0 ? .4 : l.kind === 'row' ? 2.0 + ri * .75 + (stack && !l.first ? .25 : 0) : 2.0 + rows.length * .75 + .3; });
    const TEND = 2.0 + rows.length * .75 + 4.6;      // 마지막 판(가게 이름)으로 넘어가는 시각
    const END = TEND + 3.4;
    S.setDuration(END);
    const STEP = .075;
    tiles.forEach(tl => {
      const rnd = M.rng(tl.line * 97 + tl.idx * 13 + 5);
      tl.t0 = lineStart[tl.line] + tl.idx * .045;
      tl.n = 5 + Math.floor(rnd() * 6);               // 몇 번 넘어간 뒤 멈추는지
      tl.seq = Array.from({ length: 40 }, () => glyphPool[Math.floor(rnd() * glyphPool.length)] || ' ');
      tl.t1 = TEND + tl.idx * .035 + tl.line * .05;
      tl.n2 = 3 + Math.floor(rnd() * 4);
    });
    // 시각 t 에 칸이 보일 글자 (넘김 중이면 이전·다음 글자와 진행도)
    function state(tl, t) {
      const chain = [{ t: tl.t0, from: ' ', to: tl.final, n: tl.final === ' ' ? 0 : tl.n, seed: 0 }];
      if (tl.end != null && tl.kind !== 'row') chain.push({ t: tl.t1, from: tl.final, to: tl.end, n: tl.end === tl.final ? 0 : tl.n2, seed: 20 });
      if (tl.kind === 'row') chain.push({ t: tl.t1, from: tl.final, to: ' ', n: tl.final === ' ' ? 0 : tl.n2, seed: 20 });
      let cur = ' ';
      for (const c of chain) {
        if (t < c.t) return { a: cur, b: cur, p: 0 };
        const k = (t - c.t) / STEP;
        if (c.n === 0 || k >= c.n) { cur = c.to; continue; }
        const i = Math.floor(k), p = k - i;
        const seqAt = j => j <= 0 ? c.from : j >= c.n ? c.to : tl.seq[(c.seed + j) % tl.seq.length];
        return { a: seqAt(i), b: seqAt(i + 1), p };
      }
      return { a: cur, b: cur, p: 0 };
    }
    const root = S.$('#nt');
    S.ambient(t => {
      M.drift(root, t, 1.2);
      board.style.opacity = M.clamp(t * 4).toFixed(3);
      // 판 위를 천천히 지나가는 빛과 깜박이는 표시등 (글이 멈춘 동안에도 화면이 살아 있게)
      const ph = ((t + .6) % 4.2) / 4.2;
      sheen.style.transform = `translateX(${((-.75 + 1.9 * ph) * W).toFixed(1)}px)`;
      live.style.opacity = (.35 + .65 * (.5 + .5 * Math.cos(t * Math.PI * 1.6))).toFixed(3);
      for (const tl of tiles) {
        const { a, b, p } = state(tl, t);
        // 위 고정 = 다음 글자 위쪽, 아래 고정 = 이전 글자 아래쪽, 날개1 = 이전 글자 위쪽(아래로 접힘), 날개2 = 다음 글자 아래쪽(펴짐)
        const [sTop, sBot, f1, f2] = tl.sp;
        if (p === 0) { sTop.textContent = sBot.textContent = a; tl.fl1.style.visibility = tl.fl2.style.visibility = 'hidden'; continue; }
        sTop.textContent = b; sBot.textContent = a; f1.textContent = a; f2.textContent = b;
        const k1 = M.clamp(p * 2), k2 = M.clamp(p * 2 - 1);
        tl.fl1.style.visibility = k1 < 1 ? 'inherit' : 'hidden';
        tl.fl1.style.transform = `rotateX(${(-90 * k1).toFixed(1)}deg)`;
        tl.fl1.style.filter = `brightness(${(1 - .4 * k1).toFixed(3)})`;
        tl.fl2.style.visibility = p >= .5 ? 'inherit' : 'hidden';
        tl.fl2.style.transform = `rotateX(${(90 * (1 - k2)).toFixed(1)}deg)`;
        tl.fl2.style.filter = `brightness(${(.6 + .4 * k2).toFixed(3)})`;
      }
      // 끝판: 공지 줄이 비고 제목 자리에 가게 이름
      foot.style.opacity = (t > 1 ? 1 - M.prog(t, TEND, .4) : M.clamp(t - .5)).toFixed(3);
    });
  });
})();
</script>
